plugins { id 'com.android.application' }

android {
    namespace 'com.padmapper.ayar'
    compileSdk 34
    defaultConfig {
        applicationId 'com.padmapper.ayar'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '0.7'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
