plugins { id 'com.android.application' }

android {
    namespace 'com.padmapper.ayar'
    compileSdk 34
    defaultConfig {
        applicationId 'com.padmapper.ayar'
        minSdk 24
        targetSdk 34
        versionCode 24
        versionName '0.28'
    }
    /* Sabit imza: güncellemeler eskisinin üstüne kurulur, veriler silinmez */
    signingConfigs {
        pm {
            storeFile rootProject.file('padmapper.keystore')
            storePassword System.getenv('PM_KEY_PASS')
            keyAlias 'padmapper'
            keyPassword System.getenv('PM_KEY_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            /* sabit anahtar varsa onu kullan, yoksa geçici anahtar */
            def ks = rootProject.file('padmapper.keystore')
            signingConfig (ks.exists() && ks.length() > 0 && System.getenv('PM_KEY_PASS') ? signingConfigs.pm : signingConfigs.debug)
        }
    }
}
