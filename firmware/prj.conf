# PadMapper – adım 1: Bluetooth kontrolcüyü bul, bağlan, tuş haritasını ve basışları USB seri porta yaz.
# Adım 2: tablete USB gamepad + klavye + fare çıkışı da var.

# --- Bluetooth (merkez cihaz) ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_SCAN_ADDRESS_CNT=7
CONFIG_BT_HOGP=y
# pad + 2 klavye/fare raporları (ortak havuz)
CONFIG_BT_HOGP_REPORTS_MAX=32
CONFIG_BT_MAX_CONN=5
# 2 çevre: hedef cihaz + ayar telefonu; kalan 3 merkez: pad (+ ileride Bluetooth klavye/fare)
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=2
CONFIG_BT_ID_MAX=2
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_DEVICE_NAME="pmape.github.io"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=30

# Eşleşmeleri hatırla
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- USB seri port (ayar ekranı ve test için) ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="PadMapper"
CONFIG_USB_DEVICE_MANUFACTURER="PadMapper"
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# --- Genel ---
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_BUILD_OUTPUT_UF2=y

# --- Adım 2: tablete USB klavye + fare + gamepad ---
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_DEVICE_COUNT=4
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_GPIO=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=2048
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0100
# Kartın USB belleği: tablette sorun çıkardığı için kapalı (0.5.1)

# --- Bluetooth çıkış: kart hedef cihaza klavye + fare + gamepad olarak bağlanır ---
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=3
CONFIG_BT_HIDS_INPUT_REP_MAX=4
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_CONN_CTX=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_DEVICE_APPEARANCE=964
CONFIG_BT_BUF_ACL_TX_COUNT=10

# --- Gecikme ---
# 2M PHY isteği
CONFIG_BT_USER_PHY_UPDATE=y
# pad ve hedef bağlantısı aynı anda 7,5 ms aralığa sığsın
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=2500
CONFIG_REBOOT=y

# --- Telefondan kablosuz ayar ---
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_SERVICE_CHANGED=y

# iki yayın aynı anda (oyun + ayar)
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_SET=2
