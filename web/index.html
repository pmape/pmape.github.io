<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PadMapper – XIAO reWASD tarzı eşleme</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161c; --panel:#1c1f27; --panel2:#22252f; --line:#2c303c; --text:#eef0f4; --mute:#a6acba;
  --acc:#ff8a3d; --acctx:#1a1205; --acc2:#3dd6c6; --l1:#ff5d6c; --l2:#5fd36a; --l3:#5b9bff; --warn:#ffcc4d;
  --grip:#1f222b; --gripl:#3a3f4c; --key:#2c303c; --keyl:#4a5060; --sel:#fff;
  --inhf:#332e25; --inhl:#7a6a4a; --inht:#9a8a62;
  --exb:#17231f; --exl:#28463c; --ext:#bfeee2; --nob:#2a2414; --nol:#5a4a1f; --not:#f3dfa6;
  --inb:#16222e; --inl:#2b4660; --int:#cfe3ff; --recb:#5a1f26; --prevb:#3a2f12;
  color-scheme:dark;
}
/* Siyah (AMOLED) */
:root[data-theme=amoled]{--bg:#000;--panel:#0b0c0f;--panel2:#15171c;--line:#24272f;--grip:#101217;--gripl:#2a2f3a;--key:#1c1f26;--keyl:#3a404d}
/* Açık */
:root[data-theme=light]{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#eef0f4; --line:#d5d9e2; --text:#1b1e25; --mute:#5c6475;
  --acc2:#0f8f83; --l1:#d93f50; --l2:#23883a; --l3:#2f6fdc; --warn:#a05f00;
  --grip:#e6e9ef; --gripl:#c3c9d5; --key:#ffffff; --keyl:#b3bac8; --sel:#1b1e25;
  --inhf:#f6efe0; --inhl:#c7ad78; --inht:#8a7440;
  --exb:#e8f6f1; --exl:#a5d9c8; --ext:#14584a; --nob:#fff6dd; --nol:#e6cd85; --not:#6b5210;
  --inb:#e8f0fb; --inl:#abc6ec; --int:#1d4372; --recb:#ffd9dd; --prevb:#fff1cc;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
select,input[type=number],input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 14px;min-height:40px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acctx);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ico{width:38px;padding:0;font-size:18px}
.hint{color:var(--mute);font-size:13px}

/* üst (yeni düzen) */
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.hchip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:19px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-weight:600;white-space:nowrap;min-width:0}
.hchip>span:first-child{overflow:hidden;text-overflow:ellipsis}
.hchip.grow{flex:1;justify-content:space-between}
.hchip.acc{border-color:var(--acc);color:var(--acc)}
#status{padding:10px 12px}
.flow{display:flex;align-items:center;gap:4px}
.fnode{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;border-radius:10px;cursor:pointer;text-align:left}
.fnode:hover{background:var(--panel2)}
.fnode .fi{width:36px;height:36px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);font-size:18px}
.fnode.on .fi{border-color:var(--acc)}
.fnode.bad .fi{border-color:var(--l1)}
.fnode small{display:block;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnode b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.farr{color:var(--mute);flex:none}
.fline{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
#status,#updBar{grid-column:1/-1}#updBar:empty{display:none}
.plist{display:flex;flex-direction:column;gap:6px}.prow{display:flex;gap:6px;align-items:center}.prow .pmain{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;min-width:0}.prow.on .pmain{border-color:var(--acc)}.prow small{display:block;color:var(--mute);font-size:12px}.prow .r{color:var(--acc)}
.fi0{width:40px;height:40px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.updbar{display:flex;align-items:center;gap:10px;background:var(--prevb);border:1px solid var(--warn);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px}
/* üst (eski) */
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:6px;align-items:center;margin-left:auto}
.acts .st8{font-size:13px;white-space:nowrap;padding:0 4px}
.dirty{color:var(--warn)}.clean{color:var(--l2)}
header b{color:var(--acc);font-size:16px;white-space:nowrap}
header select{flex:1;min-width:0;max-width:240px}
@media (max-width:520px){header b{display:none}}
.st.off{opacity:.45}
.layers{display:flex;gap:4px;width:100%}
.layers button{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:5px 11px;min-height:34px;cursor:pointer;font-size:13px;white-space:nowrap}
.layers button.on{color:#111;font-weight:700}
.layers button.on[data-l="0"]{background:var(--acc);border-color:var(--acc)}
.layers button.on[data-l="1"]{background:var(--l1);border-color:var(--l1)}
.layers button.on[data-l="2"]{background:var(--l2);border-color:var(--l2)}
.layers button.on[data-l="3"]{background:var(--l3);border-color:var(--l3)}
@media (max-width:620px){.layers button{flex:1}.acts{width:100%;margin-left:0}.acts .sp{flex:1}}

main{align-items:start;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px 14px;max-width:1200px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}

/* kontrolcü */
svg:not([width]){width:100%;height:auto;display:block;max-height:46vh}
.btn svg,.pchip svg{vertical-align:-3px}
#pad{max-width:520px;margin:0 auto}
.grip{fill:var(--grip);stroke:var(--gripl);stroke-width:1.5}
.b{cursor:pointer}
.b .s{fill:var(--key);stroke:var(--keyl);stroke-width:1.2}
.b.map .s{fill:color-mix(in srgb,var(--acc) 32%,var(--key));stroke:var(--acc)}
.b.inh .s{fill:var(--inhf);stroke:var(--inhl);stroke-dasharray:4 3}
.b.sel .s{stroke:var(--sel);stroke-width:2}
.b.live .s{fill:var(--acc);stroke:var(--acc)}
.b.live text{fill:#fff}
.lb{font-size:7px;font-weight:600;fill:var(--acc2);pointer-events:none;dominant-baseline:central}
.lb.inh{fill:var(--inht)}
.b text{fill:var(--text);font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.alist{display:flex;flex-direction:column}
.arow{display:flex;align-items:center;gap:12px;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.arow:last-child{border-bottom:0}
.arow .akey{min-width:44px;height:32px;padding:0 10px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.arow.on .akey{border-color:var(--acc);color:var(--acc)}
.arow .atx{flex:1;min-width:0}.arow .atx b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arow .atx small{display:block;color:var(--mute);font-size:12px}
.arow .achev{color:var(--mute);font-size:20px}
.eback{display:none}
.ehead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ehead h2{flex:1;margin:0;font-size:18px}
.tag .sdot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--l2);margin-right:6px}.tag .sdot.w{background:var(--warn)}
.li2{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit}
.card>.li2:first-child,.card>.li2:first-of-type{border-top:0}
.card>.li2:first-child{padding-top:12px}
.lnk{background:none;border:0;cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}
.pdot{width:10px;height:10px;border-radius:5px;background:var(--keyl);flex:none}.pdot.on{background:var(--acc)}
.sl{margin-top:12px}.sl input[type=range]{width:100%;accent-color:var(--acc)}
.rad{width:20px;height:20px;border-radius:10px;border:2px solid var(--keyl);display:inline-flex;align-items:center;justify-content:center;flex:none}.rad.on{border-color:var(--acc)}.rad.on i{width:10px;height:10px;border-radius:5px;background:var(--acc)}
.stbox{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin:4px 0 6px;color:var(--mute)}
.row.grow{flex:1;min-width:0}
.sheet.full .in{max-width:none;max-height:100vh;height:100%;border-radius:0}.sheet.full .in::before{display:none}
@media (min-width:700px){.sheet.full .in{max-width:640px;height:auto;max-height:92vh;border-radius:16px}}
.thm{flex:1;height:44px;border-radius:12px;border:2px solid var(--line);font-size:12px;font-weight:600;cursor:pointer}.thm.on{border-color:var(--acc)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 0}
.qbtn{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{height:34px;padding:0 12px;border-radius:17px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pchip.on{background:color-mix(in srgb,var(--acc) 22%,var(--panel2));border-color:var(--acc);color:var(--text)}
.orow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.orow.off,.srow2.off{opacity:.5}
.omain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left}
.obox{width:36px;height:36px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--acc)}
.otx{flex:1;min-width:0}.otx small{display:block;color:var(--mute);font-size:11px}.otx b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.ico.sm{width:32px;min-height:32px;height:32px;font-size:13px;border-radius:10px}
.btn.grow,.grow{flex:1}
.tl{display:flex;gap:3px;margin-top:10px}
.tlb{min-width:0;display:flex;flex-direction:column;gap:3px}
.tlb>div{height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1a1205;overflow:hidden;white-space:nowrap;padding:0 2px}
.tlb.w>div{background:none;border:1px dashed var(--keyl);color:var(--mute);font-weight:500;font-size:10px}
.tlb>span{font-size:10px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden}
.srow2{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.srow2:first-child{border-top:0}
.srow2 .grip{color:var(--mute);font-size:12px;letter-spacing:-2px}
.srow2 .cbar{width:6px;align-self:stretch;border-radius:3px;flex:none}
.bigval{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:12px;background:var(--bg);border:1px dashed var(--acc);font-size:18px;font-weight:700;color:var(--acc);cursor:pointer}
.kb{display:flex;flex-direction:column;gap:4px}
.kbr{display:flex;gap:3px}
.kk{flex:1;min-width:0;height:38px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:600;padding:0;white-space:nowrap;overflow:hidden;cursor:pointer}
.kk.m{background:color-mix(in srgb,var(--panel2) 70%,var(--line));color:var(--mute)}
.kk.s{height:30px;font-size:10px}
.kk.on{background:var(--acc);border-color:var(--acc);color:var(--acctx)}
body.editing #panel{background:var(--bg)}
@media (max-width:860px){
  #panel{display:none}
  body.editing #panel{display:block;position:fixed;inset:0;z-index:15;border-radius:0;border:0;overflow:auto;padding:14px 16px 60px;margin:0}
  body.editing{overflow:hidden}
  .eback{display:inline-flex;align-items:center;justify-content:center}
}
details.sum{margin-top:6px}
details.sum summary{cursor:pointer;color:var(--mute);font-size:13px;padding:4px 2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px;cursor:pointer}
.chip b{color:var(--mute);font-weight:600;margin-right:4px}

/* editör */
.ehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ehead h2{font-size:17px;margin:0}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.scroll{display:flex;gap:5px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pill{position:relative;flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:5px 12px;min-height:34px;cursor:pointer;font-size:13px}
.pill.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.pill .dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--acc2)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:6px 8px;min-height:36px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--acctx);font-weight:700}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* makro */
.mac{display:flex;flex-direction:column}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 6px}
.st .n{width:18px;text-align:center;color:var(--mute);font-size:12px;flex:none}
.st select{flex:1;min-width:0}
.st .a{flex:0 0 108px}
.st .ty{flex:0 0 52px;padding:4px 2px;text-align:center}
.st .stx{flex:1 0 100%;display:flex;gap:10px;align-items:center;padding-left:24px;font-size:12px;color:var(--mute)}
.st .stx input{width:64px;padding:3px 6px}
.st .mvi{display:flex;align-items:center;gap:3px;color:var(--mute);flex:1;min-width:0}.st .mvi input{width:100%;min-width:0}
.x{background:none;border:0;color:var(--mute);cursor:pointer;width:30px;height:32px;border-radius:7px;font-size:15px;flex:none}
.x:hover{color:var(--text);background:var(--bg)}
.gap{display:flex;align-items:center;gap:6px;padding:3px 0 3px 26px;color:var(--mute);font-size:13px}
.gap::before{content:"";width:2px;height:26px;background:var(--line);margin-right:6px}
.gap input{width:76px;min-height:32px;padding:3px 6px;text-align:right}
.gap .x{width:30px;height:30px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.gap.loop{color:var(--acc2)}
.gap.loop::before{background:var(--acc2)}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}
.explain{background:var(--exb);border:1px solid var(--exl);color:var(--ext);border-radius:9px;padding:7px 10px;font-size:13px;margin-top:10px}
.note{background:var(--nob);border:1px solid var(--nol);color:var(--not);border-radius:9px;padding:7px 10px;font-size:13px;margin-top:8px}
.k{display:inline-block;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px;margin:0 1px;font-family:ui-monospace,Consolas,monospace}
.rec{background:var(--recb)!important;border-color:var(--l1)!important}
input[type=range]{accent-color:var(--acc);flex:1;min-width:120px}
.dir{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dir label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}

/* ayarlar paneli */
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:#1a1d24;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:12px 14px 20px}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:16px}}
.dev{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;cursor:pointer}
.dev:hover{border-color:var(--acc)}
.dev.act{border-color:var(--acc2)}
.dev .r{color:var(--acc2);font-size:16px;width:18px;text-align:center}
.dev .ic{font-size:22px;width:28px;text-align:center}
.dev.no{opacity:.5;cursor:default}
.dev.no:hover{border-color:var(--line)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:middle}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i.on{background:var(--acc2)}
.ok{color:var(--l2);font-size:12px}.bad{color:var(--mute);font-size:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc2);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.prev{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--prevb);color:var(--warn);border:1px solid var(--nol)}
.sheet h2{font-size:18px;margin:0;flex:1}
.sheet .in::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:#3a3f4c;margin:0 auto 10px}
.sec{border-top:1px solid var(--line);padding-top:4px;margin-top:10px}
textarea{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
#card{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#card .dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
#card .dot.on{background:var(--l2)}#card .dot.warn{background:var(--warn)}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.stabs{display:flex;gap:4px;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;position:sticky;top:-1px;z-index:2;overflow-x:auto}
.stabs button{flex:1;min-width:70px;border:0;background:transparent;color:var(--mute);border-radius:9px;padding:6px 4px;min-height:44px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.stabs button span{font-size:17px;line-height:1}
.stabs button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.sbody{padding-top:10px}
.sgroup{margin-bottom:14px}
.sgt{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:0 2px 6px}

.srow:last-child{border-bottom:0}

.sinfo{position:relative}.sinfo summary{list-style:none;cursor:pointer;color:var(--mute);font-size:14px;min-width:24px;text-align:center}
.sinfo summary::-webkit-details-marker{display:none}
.sinfo[open]>div{position:absolute;z-index:3;left:0;top:24px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--text);box-shadow:0 6px 18px #0006}

.scard .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.scard .dot.on{background:var(--l2)}.scard .dot.warn{background:var(--warn)}

<script>
/* PadMapper: profilleri kartın anladığı biçime çevir + karta bağlan (bilgisayar: WebSerial, Android: WebUSB).
 * Biçim firmware/src/engine.h'de. */
const PM = (() => {
  const HID = {};
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((c, i) => HID['Key' + c] = 4 + i);
  '1234567890'.split('').forEach((c, i) => HID['Digit' + c] = 30 + i);
  for (let i = 1; i <= 12; i++) HID['F' + i] = 57 + i;
  Object.assign(HID, {
    Enter: 40, Escape: 41, Backspace: 42, Tab: 43, Space: 44, Minus: 45, Equal: 46, BracketLeft: 47,
    BracketRight: 48, Backslash: 49, Semicolon: 51, Quote: 52, Backquote: 53, Comma: 54, Period: 55,
    Slash: 56, CapsLock: 57, Insert: 73, Home: 74, PageUp: 75, Delete: 76, End: 77, PageDown: 78,
    ArrowRight: 79, ArrowLeft: 80, ArrowDown: 81, ArrowUp: 82, IntlBackslash: 100, PrintScreen: 70, ScrollLock: 71, Pause: 72,
    ControlLeft: 0xe0, ShiftLeft: 0xe1, AltLeft: 0xe2, MetaLeft: 0xe3,
    ControlRight: 0xe4, ShiftRight: 0xe5, AltRight: 0xe6,
  });
  for (let i = 1; i <= 9; i++) HID['Numpad' + i] = 88 + i;
  HID.Numpad0 = 98;

  const BTN = { A: 0, B: 1, X: 3, Y: 4, LB: 6, RB: 7, LT: 8, RT: 9, SELECT: 10, START: 11, HOME: 12,
    L3: 13, R3: 14, SHARE: 15, UP: 16, DOWN: 17, LEFT: 18, RIGHT: 19, M1: 20, M2: 21 };
  const MOUSE = { left: 0, right: 1, middle: 2, back: 3, fwd: 4, wheelUp: 5, wheelDown: 6 };
  const MEDIA = { voice: 1, search: 2, volUp: 3, volDown: 4, mute: 5, play: 6, next: 7, prev: 8, brUp: 9, brDown: 10, home: 11, back: 12 };
  const OUT = { kbm: 0, kb: 1, pad: 2, all: 3 };
  const SM = { inherit: 0, off: 1, mouse: 2, keys: 3, scroll: 4, pad: 5 };
  const TRIG = { single: 0, double: 1, long: 2, start: 3, release: 4 };
  const MODE = { normal: 0, turbo: 1, toggle: 2, macro: 3 };
  const ACTS = { press: 0, down: 1, up: 2 };

  function compile(S) {
    const b = [];
    const u8 = v => b.push(v & 255);
    const u16 = v => { v = Math.max(0, Math.min(65535, Math.round(+v || 0))); b.push(v & 255, v >> 8); };
    const d = S.device;
    const profs = S.profiles.map(p => p._applied ? JSON.parse(p._applied) : p).slice(0, 8);
    b.push(80, 77, 2);
    u8(d.startMode === 'pad' ? 1 : 0);
    u8(BTN[d.comboA] ?? 12); u8(BTN[d.comboB] ?? 10);
    u16(d.holdMs || 1500);
    u8((d.profSwitch ? 1 : 0) | (d.passUnmapped !== false ? 2 : 0));
    u8(profs.length); u8(0); /* seçili profil ayrıca 'cs' ile gider */
    u8(BTN[d.profMod || 'HOME'] ?? 12); u8(BTN[d.profPrev || 'LB'] ?? 6); u8(BTN[d.profNext || 'RB'] ?? 7); u8(0); u8(0);
    for (const p of profs) {
      u8(OUT[p.output || 'all']); u8(p.trigThr ?? 30); u16(p.longMs || 300); u16(p.doubleMs || 250);
      for (const l of p.layers) for (const s of ['LS', 'RS']) {
        const st = l.sticks[s] || { mode: 'off' };
        u8(SM[st.mode] ?? 1); u8(st.sens || 8); u8(st.dead ?? 12);
        for (const k of ['up', 'down', 'left', 'right']) u8(HID[st.keys && st.keys[k]] || 0);
      }
      const binds = [];
      p.layers.forEach((l, li) => {
        for (const id in l.btn) {
          if (BTN[id] === undefined) continue;
          for (const k in l.btn[id]) {
            const a = l.btn[id][k];
            if (!a || !(a.kind === 'layer' || (a.steps && a.steps.length))) continue;
            let trig, other = 255;
            if (k.startsWith('c_')) { trig = 5; other = BTN[k.slice(2)]; if (other === undefined) continue; }
            else { trig = TRIG[k]; if (trig === undefined) continue; }
            binds.push({ li, btn: BTN[id], trig, other, a });
          }
        }
      });
      u16(binds.length);
      for (const { li, btn, trig, other, a } of binds) {
        const steps = a.kind === 'layer' ? [] : expand(a.steps, d.layout).slice(0, 255);
        u8(li); u8(btn); u8(trig); u8(other);
        u8(a.kind === 'layer' ? 1 : 0); u8(MODE[a.mode] || 0); u16(a.turbo || 80);
        u8(a.layer || 0); u8(a.how === 'toggle' ? 1 : 0); u8(steps.length);
        for (const s of steps) {
          if (s.t === 'key') { u8(0); u8(HID[s.k] || 0); }
          else if (s.t === 'mouse') { u8(1); u8(MOUSE[s.b] ?? 0); }
          else if (s.t === 'media') { u8(3); u8(MEDIA[s.m] ?? 1); }
          else if (s.t === 'move') { u8(4); u8(s.x & 255); u8(s.y & 255); u16(s.after || 0); continue; }
          else { u8(2); u8(BTN[s.p] ?? 0); }
          u8(ACTS[s.a] ?? 0); u16(s.after || 0);
        }
      }
    }
    return new Uint8Array(b);
  }

  /* Karttaki ayardan profilleri geri çıkar (profil adları kartta yok: Profil 1, 2…) */
  const inv = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [v, k]));
  function decompile(b) {
    const HIDI = inv(HID), BTNI = inv(BTN), MOUSEI = inv(MOUSE), MEDIAI = inv(MEDIA), OUTI = inv(OUT), SMI = inv(SM), TRIGI = inv(TRIG), MODEI = inv(MODE), ACTSI = inv(ACTS);
    let i = 0;
    const u8 = () => b[i++], u16 = () => { const v = b[i] | (b[i + 1] << 8); i += 2; return v; };
    if (b[0] !== 80 || b[1] !== 77 || b[2] !== 2) throw new Error('Karttaki ayar okunamadı');
    i = 3;
    const d = { startMode: u8() ? 'pad' : 'map', comboA: BTNI[u8()] || 'HOME', comboB: BTNI[u8()] || 'SELECT', holdMs: u16() };
    const fl = u8(); d.profSwitch = !!(fl & 1); d.passUnmapped = !!(fl & 2);
    const np = u8(); u8();
    d.profMod = BTNI[u8()] || 'HOME'; d.profPrev = BTNI[u8()] || 'LB'; d.profNext = BTNI[u8()] || 'RB'; u8(); u8();
    const profiles = [];
    for (let n = 0; n < np; n++) {
      const p = { name: 'Profil ' + (n + 1), output: OUTI[u8()] || 'all', trigThr: u8(), longMs: u16(), doubleMs: u16(), gapMs: 50, layers: [] };
      for (let l = 0; l < 4; l++) {
        const sticks = {};
        for (const s of ['LS', 'RS']) {
          const mode = SMI[u8()] || 'off', sens = u8(), dead = u8(), k = [u8(), u8(), u8(), u8()].map(x => HIDI[x] || '');
          sticks[s] = { mode, sens, dead, keys: { up: k[0] || 'KeyW', down: k[1] || 'KeyS', left: k[2] || 'KeyA', right: k[3] || 'KeyD' } };
        }
        p.layers.push({ btn: {}, sticks });
      }
      const nb = u16();
      for (let k = 0; k < nb; k++) {
        const li = u8(), btn = BTNI[u8()], trig = u8(), other = u8(), kind = u8(), mode = u8(), loop = u16(), tl = u8(), how = u8(), ns = u8();
        const a = { kind: kind ? 'layer' : 'combo', mode: MODEI[mode] || 'normal', turbo: loop, layer: tl || 1, how: how ? 'toggle' : 'hold', steps: [] };
        for (let s = 0; s < ns; s++) {
          const t = u8(), c = u8(), acr = u8(), ac = ACTSI[acr] || 'press', after = u16();
          if (t === 4) { a.steps.push({ t: 'move', x: (c << 24) >> 24, y: (acr << 24) >> 24, after }); continue; }
          a.steps.push(t === 0 ? { t: 'key', k: HIDI[c] || '', a: ac, after } : t === 1 ? { t: 'mouse', b: MOUSEI[c] || 'left', a: ac, after } : t === 3 ? { t: 'media', m: MEDIAI[c] || 'voice', a: ac, after } : { t: 'pad', p: BTNI[c] || 'A', a: ac, after });
        }
        if (!btn) continue;
        const key = trig === 5 ? 'c_' + (BTNI[other] || '') : TRIGI[trig];
        if (!key || key === 'c_') continue;
        (p.layers[li].btn[btn] = p.layers[li].btn[btn] || {})[key] = a;
      }
      profiles.push(p);
    }
    return { cur: 0, profiles, device: d };
  }

  /* Profillerin düzenlenebilir hali: sıkıştırıp karta da yazılır */
  async function pack(obj) {
    const raw = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream === 'undefined') return Uint8Array.from([74, ...raw]); /* 'J' */
    const z = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    const out = new Uint8Array(z.length + 1); out[0] = 71; out.set(z, 1); return out; /* 'G' */
  }
  async function unpack(b) {
    if (b[0] === 74) return JSON.parse(new TextDecoder().decode(b.slice(1)));
    const r = await new Response(new Blob([b.slice(1)]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(r));
  }
  /* Bluetooth daha yavaş: bekleme süresi uzun */
  const TO = () => link.via === 'ble' ? 25000 : 8000;
  const unhex = s => Uint8Array.from((s.match(/../g) || []).map(x => parseInt(x, 16)));

  function collect(cmd, ev, ms) {
    return new Promise((res, rej) => {
      const prev = link.onLine; let acc = '';
      const t = setTimeout(() => { link.onLine = prev; rej(new Error('Kart cevap vermedi')); }, ms);
      link.onLine = e => { prev(e); if (e.ev === ev) acc += e.d; if (e.ev === ev + '_end') { clearTimeout(t); link.onLine = prev; res(unhex(acc)); } };
      sendLine(cmd).catch(rej);
    });
  }
  async function readCard() {
    const info = link.info || {};
    if (info.jlen) { try { return { state: await unpack(await collect('jr', 'jdata', TO())), full: true }; } catch (e) { } }
    if (info.cfg) return { state: decompile(await collect('cr', 'cfgdata', TO())), full: false };
    return null;
  }
  async function writeJson(state) {
    const b = await pack(state);
    if (b.length > 8192) return false;
    const w = waitEv('json', TO());
    await sendLine('jb ' + b.length);
    for (let i = 0; i < b.length; i += 200) { await sendLine('jd ' + hex(b.slice(i, i + 200))); await new Promise(r => setTimeout(r, 15)); }
    await sendLine('je ' + crc32(b).toString(16).padStart(8, '0'));
    const r = await w;
    if (r.ok && link.info) { link.info.jlen = b.length; link.info.jcrc = crc32(b).toString(16).padStart(8, '0'); }
    return !!r.ok;
  }

  /* Yazı → tuş basışları (Türkçe Q ya da US düzeni). [kod, shift, altgr] */
  const TXT_US = {}, TXT_TR = {};
  (() => {
    const set = (m, ch, k, sh = 0, ag = 0) => { if (!(ch in m)) m[ch] = [k, sh, ag]; };
    for (const m of [TXT_US, TXT_TR]) {
      'abcdefghjklmnopqrstuvwxyz'.split('').forEach(c => { set(m, c, 'Key' + c.toUpperCase()); set(m, c.toUpperCase(), 'Key' + c.toUpperCase(), 1); });
      '1234567890'.split('').forEach(c => set(m, c, 'Digit' + c));
      set(m, ' ', 'Space'); set(m, '\n', 'Enter'); set(m, '\t', 'Tab');
    }
    set(TXT_US, 'i', 'KeyI'); set(TXT_US, 'I', 'KeyI', 1);
    const us = { '-': ['Minus'], '=': ['Equal'], '[': ['BracketLeft'], ']': ['BracketRight'], '\\': ['Backslash'], ';': ['Semicolon'], "'": ['Quote'], '`': ['Backquote'], ',': ['Comma'], '.': ['Period'], '/': ['Slash'],
      '_': ['Minus', 1], '+': ['Equal', 1], '{': ['BracketLeft', 1], '}': ['BracketRight', 1], '|': ['Backslash', 1], ':': ['Semicolon', 1], '"': ['Quote', 1], '~': ['Backquote', 1], '<': ['Comma', 1], '>': ['Period', 1], '?': ['Slash', 1],
      '!': ['Digit1', 1], '@': ['Digit2', 1], '#': ['Digit3', 1], '$': ['Digit4', 1], '%': ['Digit5', 1], '^': ['Digit6', 1], '&': ['Digit7', 1], '*': ['Digit8', 1], '(': ['Digit9', 1], ')': ['Digit0', 1] };
    for (const [c, [k, s]] of Object.entries(us)) set(TXT_US, c, k, s || 0);
    const tr = { 'ı': ['KeyI'], 'I': ['KeyI', 1], 'i': ['Quote'], 'İ': ['Quote', 1], 'ğ': ['BracketLeft'], 'Ğ': ['BracketLeft', 1], 'ü': ['BracketRight'], 'Ü': ['BracketRight', 1],
      'ş': ['Semicolon'], 'Ş': ['Semicolon', 1], 'ö': ['Comma'], 'Ö': ['Comma', 1], 'ç': ['Period'], 'Ç': ['Period', 1], '.': ['Slash'], ':': ['Slash', 1], ',': ['Backslash'], ';': ['Backslash', 1],
      '"': ['Backquote'], 'é': ['Backquote', 1], '*': ['Minus'], '?': ['Minus', 1], '-': ['Equal'], '_': ['Equal', 1], '<': ['IntlBackslash'], '>': ['IntlBackslash', 1],
      '!': ['Digit1', 1], "'": ['Digit2', 1], '^': ['Digit3', 1], '+': ['Digit4', 1], '%': ['Digit5', 1], '&': ['Digit6', 1], '/': ['Digit7', 1], '(': ['Digit8', 1], ')': ['Digit9', 1], '=': ['Digit0', 1],
      '@': ['KeyQ', 0, 1], '#': ['Digit3', 0, 1], '$': ['Digit4', 0, 1], '{': ['Digit7', 0, 1], '[': ['Digit8', 0, 1], ']': ['Digit9', 0, 1], '}': ['Digit0', 0, 1], '\\': ['Minus', 0, 1], '|': ['Equal', 0, 1], '~': ['BracketRight', 0, 1] };
    for (const [c, [k, s, g]] of Object.entries(tr)) { TXT_TR[c] = [k, s || 0, g || 0]; }
  })();
  /* Düzenleyicideki kolaylıkları kartın anladığı adımlara aç: yazı, basılı tutma süresi, tekrar sayısı */
  function expand(steps, layout) {
    const out = [], map = layout === 'us' ? TXT_US : TXT_TR;
    for (const s of steps || []) {
      const n = Math.max(1, Math.min(50, (s.rep | 0) || 1));
      for (let r = 0; r < n; r++) {
        const after = r < n - 1 ? (s.repGap ?? s.after ?? 0) : (s.after || 0);
        if (s.t === 'text') {
          const chars = Array.from(s.s || '');
          chars.forEach((ch, i) => {
            const m = map[ch]; if (!m) return;
            const last = i === chars.length - 1, gap = last ? after : Math.max(30, s.gap || 35);
            if (m[1]) out.push({ t: 'key', k: 'ShiftLeft', a: 'down', after: 0 });
            if (m[2]) out.push({ t: 'key', k: 'AltRight', a: 'down', after: 0 });
            out.push({ t: 'key', k: m[0], a: 'press', after: m[1] || m[2] ? 15 : gap });
            if (m[2]) out.push({ t: 'key', k: 'AltRight', a: 'up', after: m[1] ? 0 : gap });
            if (m[1]) out.push({ t: 'key', k: 'ShiftLeft', a: 'up', after: gap });
          });
        } else if (s.t === 'move') {
          /* büyük kaydırmayı 127'lik parçalara böl */
          let x = Math.round(+s.x || 0), y = Math.round(+s.y || 0);
          do {
            const px = Math.max(-127, Math.min(127, x)), py = Math.max(-127, Math.min(127, y));
            x -= px; y -= py;
            out.push({ t: 'move', x: px, y: py, after: x || y ? 0 : after });
          } while (x || y);
        } else if (s.a === 'hold' && !(s.t === 'mouse' && String(s.b).startsWith('wheel'))) {
          out.push(Object.assign({}, s, { a: 'down', after: Math.max(0, +s.hold || 100) }));
          out.push(Object.assign({}, s, { a: 'up', after }));
        } else {

/* ---------- Kısa açıklamalar ---------- */
function stepLabel(s){
  const x=(s.a==='hold'?' '+fmtMs(s.hold||100):'')+((s.rep|0)>1?' ×'+(s.rep|0):'');
  if(s.t==='move')return `<span class="k">↔ ${s.x|0},${s.y|0}${x}</span>`;
  if(s.t==='text')return `<span class="k">“${esc(String(s.s||'').slice(0,16))}${String(s.s||'').length>16?'…':''}”${x}</span>`;
  if(x&&s.t!=='media')return stepLabel(Object.assign({},s,{a:'press',rep:1})).replace('</span>',esc(x)+'</span>');
  if(s.t==='key')return `<span class="k">${esc(keyName(s.k))}</span>`;
  if(s.t==='mouse')return `<span class="k">${MOUSE_LABEL[s.b]}</span>`;
  if(s.t==='pad')return `<span class="k">🎮${esc(PAD_LABEL[s.p])}</span>`;
  if(s.t==='media')return `<span class="k">${esc(MEDIA_LABEL[s.m]||s.m)}</span>`;
  return '';
}
function descAct(a){
  if(!isSet(a))return '';
  if(a.kind==='layer')return `→ ${LAYER_NAMES[a.layer]}`;
  const p=a.steps.map(stepLabel);
  let s=p.length>4?p.slice(0,4).join('')+'…':p.join('');
  if(a.mode==='turbo')s='<span class="k">Turbo</span>'+s;
  if(a.mode==='toggle')s='⇄'+s;
  if(a.mode==='macro')s='▶'+s;
  return s;
}
function descStick(st){
  if(!st||st.mode==='inherit'||st.mode==='off')return '';
  if(st.mode==='mouse')return 'Fare';
  if(st.mode==='scroll')return 'Tekerlek';
  if(st.mode==='pad')return '🎮 Çubuk';
  return ['up','left','down','right'].map(d=>`<span class="k">${esc(st.keys[d]?keyName(st.keys[d]):'—')}</span>`).join('');
}

const MSHORT={left:'Sol tık',right:'Sağ tık',middle:'Orta tık',back:'Geri',fwd:'İleri',wheelUp:'Teker↑',wheelDown:'Teker↓'};
function shortAct(a){
  if(a.kind==='layer')return a.layer?'→S'+a.layer:'→Ana';
  const s=a.steps[0];let t=a.steps.length>1?'Makro':s.t==='key'?keyName(s.k):s.t==='mouse'?MSHORT[s.b]:'🎮'+s.p;
  if(t.length>8)t=t.slice(0,7)+'…';
  return (a.mode==='turbo'?'⚡':a.mode==='toggle'?'⇄':a.mode==='macro'?'▶':'')+t;
}
function shortBind(bd){const l=actList(bd).filter(([k])=>isSet(bd[k]));if(!l.length)return '';return shortAct(bd[l[0][0]])+(l.length>1?' +'+(l.length-1):'');}
function shortStick(st){
  if(st.mode==='mouse')return 'Fare';if(st.mode==='scroll')return 'Teker';if(st.mode==='pad')return '🎮';if(st.mode!=='keys')return '';
  const k=['up','left','down','right'].map(d=>keyName(st.keys[d]));return k.every(x=>x.length===1)?k.join(''):'Tuşlar';
}

function drawPad(){
  let h=`<path class="grip" d="M92 46h156c30 0 48 18 54 46l18 78c5 24-26 40-44 20l-24-28H88l-24 28c-18 20-49 4-44-20l18-78c6-28 24-46 54-46z"/>`;

    const sh=b.sh==='c'?`<circle class="s" cx="${b.x}" cy="${b.y}" r="${b.r}"/>`:`<rect class="s" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="6"/>`;
    const cx=b.sh==='c'?b.x:b.x+b.w/2,cy=b.sh==='c'?b.y:b.y+b.h/2;
    const inner=b.stick?`<circle cx="${b.x}" cy="${b.y}" r="${b.r*.55}" fill="none" stroke="var(--keyl)" stroke-width="2" pointer-events="none"/>`:'';
    h+=`<g class="b" id="b-${b.id}" onclick="pick('${b.id}')"><title>${esc(b.name)}</title>${sh}${inner}<text x="${cx}" y="${cy}">${b.t}</text></g>`;
  }
  for(const b of BTNS){if(hiddenBtn(b))continue;const [x,y,an]=LPOS[b.id];h+=`<text class="lb" id="l-${b.id}" x="${x}" y="${y}" text-anchor="${an}"></text>`;}

function paintPad(){
  if(document.querySelectorAll('#pad .b').length!==BTNS.filter(b=>!hiddenBtn(b)).length)drawPad();
  for(const b of BTNS){
    const g=document.getElementById('b-'+b.id);if(!g)continue;let mapped,inh=false;
    if(b.stick){const st=L().sticks[b.id];mapped=st.mode!=='inherit'&&st.mode!=='off';
      if(ui.layer>0&&st.mode==='inherit')inh=P().layers[0].sticks[b.id].mode!=='off';}
    else{const bd=L().btn[b.id];mapped=bindSet(bd);
      if(ui.layer>0&&!mapped&&!(bd&&bd.noInherit))inh=bindSet(P().layers[0].btn[b.id]);}
    const lb=document.getElementById('l-'+b.id);
    const src=b.stick?(mapped?L().sticks[b.id]:inh?P().layers[0].sticks[b.id]:null):(mapped?L().btn[b.id]:inh?P().layers[0].btn[b.id]:null);

function stepValue(s){
  if(s.t==='key')return keyName(s.k);
  if(s.t==='mouse')return MOUSE_LABEL[s.b]||s.b;
  if(s.t==='pad')return PAD_LABEL[s.p]||s.p;

  if(s.t==='move')return `→ ${s.x|0}  ↓ ${s.y|0}`;
  if(s.t==='text')return '“'+String(s.s||'').slice(0,24)+(String(s.s||'').length>24?'…':'')+'”';

function stepSub(s){

  if(s.t==='move'||s.t==='text')p.push(s.t==='text'?(S.device.layout==='us'?'US düzen':'Türkçe Q'):'kaydır');

function seqDur(s){return (s.t==='text'?Math.max(1,Array.from(s.s||'').length)*35:s.a==='hold'?(+s.hold||100):50)*Math.max(1,s.rep|0||1);}

function startSeq(){const a=curA();a.seq=true;a.mode='macro';render();}

function addTogether(t){

  if(a.mode==='toggle')return single?`Bir bas: ${seq} basılı kalır. Bir daha bas: bırakılır.`:`Bir bas: ${seq} tekrar etmeye başlar. Bir daha bas: durur.`;

function gvoiceSetup(){

function add(t){
  const st=curA().steps,g=P().gapMs;
  if(st.length&&!st[st.length-1].after)st[st.length-1].after=g;

  render();
}
function newStep(t,after){return t==='move'?{t,x:50,y:0,after}:t==='text'?{t,s:'',after}:t==='key'?{t,k:'KeyZ',a:'press',after}:t==='mouse'?{t,b:'left',a:'press',after}:t==='media'?{t,m:'voice',a:'press',after}:{t,p:'A',a:'press',after};}
function setType(i,t){const s=curA().steps;s[i]=Object.assign(newStep(t,s[i].after),{a:s[i].a||'press'});render();}
function rm(i){undoSave();curA().steps.splice(i,1);render();undoToast('Silindi');}
function macroMs(st){let t=0;for(const s of st){const n=(s.rep|0)||1;const one=(s.t==='text'?Math.max(1,Array.from(s.s||'').length)*35:0)+(s.a==='hold'?(+s.hold||100):0)+(+s.after||0);t+=one*n;}return t;}

function libOpen(){
  S.lib=S.lib||[];const a=curA();
  const d=document.createElement('div');d.className='sheet open';d.style.zIndex=25;
  const draw=()=>{d.innerHTML=`<div class="in" style="max-width:440px"><div class="row"><h2 style="margin:0">📚 Makro kütüphanesi</h2><span style="flex:1"></span><button class="btn ico" data-x="close">✕</button></div>
    <p class="hint">Sık kullandığın makroları kaydet, istediğin tuşa tek dokunuşla ekle.</p>
    <div class="slist">${S.lib.map((m,i)=>`<button data-i="${i}"><span>▶</span>${esc(m.name)}<small>${m.steps.length} adım · ${fmtMs(macroMs(m.steps))}</small></button><button class="btn" data-del="${i}" style="justify-self:end">Sil</button>`).join('')||'<div class="empty">Henüz kayıtlı makro yok.</div>'}</div>
    <div class="sbtns"><button class="btn pri" data-x="save" ${a.steps.length?'':'disabled'}>Bu makroyu kaydet</button></div></div>`;};
  draw();document.body.appendChild(d);
  d.onclick=async e=>{
    if(e.target===d){d.remove();return;}
    const t=e.target.closest('[data-x],[data-i],[data-del]');if(!t)return;
    if(t.dataset.x==='close'){d.remove();return;}
    if(t.dataset.x==='save'){const n=await ask('Makronun adı:',BY_ID[ui.sel].name+' makrosu');if(!n)return;S.lib.push({name:String(n).slice(0,40),steps:JSON.parse(JSON.stringify(a.steps))});save();draw();toast('Kütüphaneye kaydedildi');return;}
    if(t.dataset.del!=null){S.lib.splice(+t.dataset.del,1);save();draw();return;}
    const m=S.lib[+t.dataset.i];a.steps.push(...JSON.parse(JSON.stringify(m.steps)));if(a.steps.length>1&&a.mode==='normal')a.mode='macro';d.remove();render();toast(m.name+' eklendi');
  };
}
function mv(i,d){const s=curA().steps,j=i+d;if(j<0||j>=s.length)return;[s[i],s[j]]=[s[j],s[i]];render();}
function setStep(i,k,v){curA().steps[i][k]=v;render();}
const clamp=v=>Math.max(0,Math.min(60000,Math.round(+v||0)));
const stepOf=v=>v>=1000?100:10;
function gap(i,d,v){const s=curA().steps[i];s.after=d?clamp(s.after+d*stepOf(s.after+(d<0?-1:0))):clamp(v);render();}
function loopGap(d,v){const a=curA();a.turbo=Math.max(10,d?clamp(a.turbo+d*stepOf(a.turbo+(d<0?-1:0))):clamp(v));render();}
function setAll(){const ms=clamp(document.getElementById('allGap').value);P().gapMs=ms;curA().steps.forEach(s=>s.after=ms);render();toast('Hepsinin arası '+fmtMs(ms));}
function toggleRec(){rec?stopRec():(rec={t:0,steps:[]});render();}
function stopRec(){
  const st=rec.steps,out=[];
  for(let i=0;i<st.length;i++){
    const s=st[i],n=st[i+1];
    if(s.a==='down'&&n&&n.a==='up'&&n.k===s.k&&s.after<=150){out.push({t:'key',k:s.k,a:'press',after:n.after});i++;continue;}
    out.push(s);
  }
  if(out.length)out[out.length-1].after=out[out.length-1].after||P().gapMs;
  curA().steps.push(...out);rec=null;render();
}
function recEv(e,a){
  e.preventDefault();if(e.repeat)return;
  const now=performance.now();
  if(rec.steps.length)rec.steps[rec.steps.length-1].after=Math.round(now-rec.t);
  rec.steps.push({t:'key',k:e.code,a,after:0});rec.t=now;
  if(a==='down')toast('Kayıt: '+keyName(e.code));
}

async function pair(a){

/* ---------- Tuş tanıtma ---------- */
function parseMap(hex){
  const b=hex.match(/../g).map(x=>parseInt(x,16));
  const out=[],off={};let g={page:0,lmin:0,lmax:0,size:0,count:0,id:0},loc={u:[],min:null,max:null},i=0;
  const sgn=(v,sz)=>sz===1&&v>127?v-256:sz===2&&v>32767?v-65536:v;
  while(i<b.length){
    const p=b[i],sz=[0,1,2,4][p&3],tag=p&0xfc;let d=0;
    for(let k=0;k<sz;k++)d|=b[i+1+k]<<(8*k);d>>>=0;i+=1+sz;
    switch(tag){
      case 0x04:g.page=d;break; case 0x14:g.lmin=sgn(d,sz);break; case 0x24:g.lmax=sgn(d,sz);break;
      case 0x74:g.size=d;break; case 0x94:g.count=d;break; case 0x84:g.id=d;break;
      case 0x08:loc.u.push(sz===4?[d>>>16,d&0xffff]:[g.page,d]);break;
      case 0x18:loc.min=d;break; case 0x28:loc.max=d;break;
      case 0xa0:loc={u:[],min:null,max:null};break;
      case 0x80:{
        const rid=g.id,o=off[rid]||0,isConst=d&1,isVar=!!(d&2);
        let us=loc.u.slice();if(!us.length&&loc.min!==null)for(let u=loc.min;u<=loc.max;u++)us.push([g.page,u]);
        if(isConst){}
        else if(isVar){for(let k=0;k<g.count;k++){const u=us[Math.min(k,us.length-1)];if(u)out.push({rid,bit:o+k*g.size,size:g.size,page:u[0],usage:u[1],lmin:g.lmin,lmax:g.lmax,kind:'var'});}}
        else{for(let k=0;k<g.count;k++)out.push({rid,bit:o+k*g.size,size:g.size,page:g.page,usage:loc.min||0,lmin:g.lmin,lmax:g.lmax,kind:'array'});}
        off[rid]=o+g.count*g.size;loc={u:[],min:null,max:null};break;}
      case 0x90:case 0xb0:loc={u:[],min:null,max:null};break;
    }
  }
  out.forEach(f=>{f.key=f.rid+':'+f.bit;f.name=fName(f);f.type=f.kind==='array'?'array':(f.page===9||f.lmax===1)?'btn':(f.page===1&&f.usage===0x39)?'hat':'axis';});
  return out;
}
function fName(f){
  if(f.page===9)return 'Düğme '+f.usage;
  if(f.page===1)return {0x30:'X',0x31:'Y',0x32:'Z',0x33:'Rx',0x34:'Ry',0x35:'Rz',0x36:'Kaydırıcı',0x39:'Yön'}[f.usage]||('Genel '+f.usage.toString(16));
  if(f.page===2)return {0xc4:'Gaz',0xc5:'Fren'}[f.usage]||('Sim '+f.usage.toString(16));
  if(f.page===0xc)return 'Medya';
  return 'Sayfa '+f.page.toString(16);
}
function readBits(by,bit,size,signed){let v=0;for(let k=0;k<size;k++){const B=bit+k;if(by[B>>3]&(1<<(B&7)))v+=2**k;}if(signed&&v>=2**(size-1))v-=2**size;return v;}
const LSTEPS=[
  ['A','A tuşuna bas'],['B','B tuşuna bas'],['X','X tuşuna bas'],['Y','Y tuşuna bas'],
  ['LB','LB (sol omuz)'],['RB','RB (sağ omuz)'],['LT','LT (sol tetik), sonuna kadar bas'],['RT','RT (sağ tetik), sonuna kadar bas'],
  ['SELECT','Select / View'],['START','Start / Menu'],['HOME','Home'],['SHARE','Ekran görüntüsü tuşu'],
  ['L3','Sol çubuğa bastır (L3)'],['R3','Sağ çubuğa bastır (R3)'],
  ['UP','Yön tuşu YUKARI'],['DOWN','Yön tuşu AŞAĞI'],['LEFT','Yön tuşu SOL'],['RIGHT','Yön tuşu SAĞ'],
  ['LS_X','Sol çubuğu SAĞA it'],['LS_Y','Sol çubuğu AŞAĞI it'],['RS_X','Sağ çubuğu SAĞA it'],['RS_Y','Sağ çubuğu AŞAĞI it'],
  ['M1','Arka sol tuş (M1)'],['M2','Arka sağ tuş (M2)'],
];
let lw=null;
function openLearn(){
  lw={fields:[],map:'',state:{},idle:null,i:0,res:{},used:new Set(),phase:'load',raw:[],ctrl:null};
  document.getElementById('scan').classList.add('open');renderLearn();
  PM.sendLine('map').catch(()=>{});
}
function closeLearn(){lw=null;document.getElementById('scan').classList.remove('open');}
function lActive(f){
  const v=lw.state[f.key];if(v===undefined)return false;
  if(f.type==='btn'||f.type==='array')return v!==0&&(!lw.idle||lw.idle[f.key]!==v);
  if(f.type==='hat')return v>=f.lmin&&v<=f.lmax;
  return Math.abs(v-lBase(f))>(f.lmax-f.lmin)*0.35;
}
/* bırakılmış hali: kartın gönderdiği son rapor; yoksa tetikler en küçük değerde, çubuklar ortada */
const lBase=f=>lw.idle&&lw.idle[f.key]!==undefined?lw.idle[f.key]:f.page===2?f.lmin:(f.lmin+f.lmax)/2;
function learnEv(ev){
  if(!lw)return;
  if(ev.ev==='ctrl'){lw.ctrl=ev;if(!ev.connected){lw.phase='nopad';renderLearn();}}
  if(ev.ev==='map'){lw.map+=ev.d;}
  if(ev.ev==='map_end'){lw.fields=lw.map?parseMap(lw.map):[];lw.phase=lw.fields.length?'idle':'nomap';renderLearn();
    setTimeout(()=>{if(lw&&lw.phase==='idle'){lw.idle={...lw.state};lw.phase='wait';renderLearn();}},900);}
  if(ev.ev==='rep'){
    const by=(ev.d.match(/../g)||[]).map(x=>parseInt(x,16));
    for(const f of lw.fields)if(f.rid===ev.id)lw.state[f.key]=readBits(by,f.bit,f.size,f.lmin<0);
    if(lw.phase==='wait'||lw.phase==='release'){const r=ev.id+':'+ev.d;if(!lw.raw.includes(r)){lw.raw.push(r);if(lw.raw.length>12)lw.raw.shift();}}
    lDetect();
  }
}
function lDetect(){
  if(lw.i>=LSTEPS.length)return;
  if(lw.phase==='release'){if(!lw.fields.some(lActive)){lw.phase='wait';lw.raw=[];renderLearn();}return;}
  if(lw.phase!=='wait')return;
  const [id]=LSTEPS[lw.i];
  for(const f of lw.fields){
    if(!lActive(f))continue;
    const v=lw.state[f.key],sig=f.type==='hat'||f.type==='array'?f.key+'='+v:f.key;
    if(lw.used.has(sig))continue;
    const base=lBase(f);
    lw.res[id]=f.type==='hat'?{t:'hat',rid:f.rid,bit:f.bit,size:f.size,v,lmin:f.lmin,name:'Yön'}
      :f.type==='array'?{t:'usage',rid:f.rid,bit:f.bit,size:f.size,v,name:fName(f)+' 0x'+v.toString(16)}
      :f.type==='axis'?{t:'axis',rid:f.rid,bit:f.bit,size:f.size,min:f.lmin,max:f.lmax,dir:v>base?1:-1,name:f.name}
      :{t:'btn',rid:f.rid,bit:f.bit,name:f.name};

const sigOf=m=>m&&(m.t==='hat'||m.t==='usage'?`${m.rid}:${m.bit}=${m.v}`:`${m.rid}:${m.bit}`);
function lSkip(kind){const [id]=LSTEPS[lw.i];lw.res[id]=kind==='miss'?{t:'missing',raw:lw.raw.slice()}:null;lw.i++;lw.raw=[];lw.phase=lw.fields.some(lActive)?'release':'wait';renderLearn();}
function lBack(){if(lw.i>0){lw.i--;const m=lw.res[LSTEPS[lw.i][0]];if(m&&m.t!=='missing')lw.used.delete(sigOf(m));delete lw.res[LSTEPS[lw.i][0]];lw.phase='wait';lw.raw=[];renderLearn();}}
function lDesc(m){if(m===undefined)return '';if(!m)return '<span class="hint">yok</span>';if(m.t==='missing')return '<span style="color:var(--warn)">var ama algılanmadı</span>';
  if(m.t==='axis')return esc(m.name)+(m.dir>0?' +':' −');return esc(m.name)+(m.t==='hat'?' = '+m.v:'');}
function renderLearn(){

  }

const PBI={A:0,B:1,X:3,Y:4,LB:6,RB:7,LT:8,RT:9,SELECT:10,START:11,HOME:12,L3:13,R3:14,SHARE:15,UP:16,DOWN:17,LEFT:18,RIGHT:19,M1:20,M2:21};
function lEntries(){
  const out=[],ent=(rid,kind,tgt,size,bit,flags,arg,mn,mx)=>out.push(rid,kind,tgt,size,bit&255,bit>>8,flags,0,arg&255,(arg>>8)&255,mn&255,(mn>>8)&255,mx&255,(mx>>8)&255);
  let hatDone=false;
  for(const [id] of LSTEPS){
    const m=lw.res[id];if(!m||m.t==='missing')continue;
    const stick={LS_X:0,LS_Y:1,RS_X:2,RS_Y:3}[id];
    if(stick!==undefined){if(m.t==='axis')ent(m.rid,1,stick,m.size,m.bit,m.dir<0?1:0,0,m.min,m.max);continue;}
    const pb=PBI[id];
    if(m.t==='btn')ent(m.rid,0,pb,1,m.bit,0,0,0,1);
    else if(m.t==='usage')ent(m.rid,5,pb,m.size,m.bit,0,m.v,0,0);
    else if(m.t==='hat'){if(['UP','DOWN','LEFT','RIGHT'].includes(id)){if(!hatDone){ent(m.rid,3,0,m.size,m.bit,0,m.lmin&0xffff,0,0);hatDone=true;}}else ent(m.rid,5,pb,m.size,m.bit,0,m.v,0,0);}
    else if(m.t==='axis'){
      if(id==='LT'||id==='RT')ent(m.rid,2,id==='LT'?0:1,m.size,m.bit,m.dir<0?1:0,0,m.min,m.max);
      else ent(m.rid,4,pb,m.size,m.bit,m.dir<0?4:0,60,m.min,m.max);
    }
  }
  return out;
}

/* ---------- Tema ---------- */
const ACCENTS=[{k:'orange',n:'Turuncu',c:'#ff8a3d',t:'#1a1205'},{k:'teal',n:'Turkuaz',c:'#2ec4b6',t:'#04201d'},{k:'blue',n:'Mavi',c:'#4c8dff',t:'#ffffff'},
  {k:'purple',n:'Mor',c:'#9b6bff',t:'#ffffff'},{k:'green',n:'Yeşil',c:'#3fbf5a',t:'#06200c'},{k:'pink',n:'Pembe',c:'#ff5fa2',t:'#2a0716'},{k:'red',n:'Kırmızı',c:'#ff4d4d',t:'#ffffff'},{k:'yellow',n:'Sarı',c:'#f5c400',t:'#241c00'}];
const themeOf=()=>Object.assign({mode:'dark',acc:'orange'},S.theme||{});
const darkMq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){
  const t=themeOf(),mode=t.mode==='auto'?(darkMq&&!darkMq.matches?'light':'dark'):t.mode,a=ACCENTS.find(x=>x.k===t.acc)||ACCENTS[0],r=document.documentElement;
  if(mode==='dark')r.removeAttribute('data-theme');else r.setAttribute('data-theme',mode);
  r.style.setProperty('--acc',a.c);r.style.setProperty('--acctx',a.t);
  /* uygulamada üst/alt çubuk rengi */
  if(PM.native&&PMNative.setBars){const cs=getComputedStyle(r);PMNative.setBars(cs.getPropertyValue('--panel').trim(),cs.getPropertyValue('--bg').trim(),mode==='light');}
}
function setTheme(x){S.theme=Object.assign(themeOf(),x);applyTheme();save();renderSheet();drawPad();render();}
if(darkMq&&darkMq.addEventListener)darkMq.addEventListener('change',()=>{if(themeOf().mode==='auto')applyTheme();});
applyTheme();

/* ---------- Kartın anlık durumu: ekran hep bunu gösterir ---------- */
let cardState=null,stT=null;
/* canlı pad: kart basılı tuşları ve çubukları bildirir */
const LIVE_BITS=['A','B','','X','Y','','LB','RB','LT','RT','SELECT','START','HOME','L3','R3','SHARE','UP','DOWN','LEFT','RIGHT'];
let liveSeen=0;
function livePad(ev){
  liveSeen=Date.now();
  const on=new Set();
  if(ev.v){LIVE_BITS.forEach((id,i)=>{if(id&&(ev.b>>>i)&1)on.add(id);});if(ev.t[0]>60)on.add('LT');if(ev.t[1]>60)on.add('RT');}
  for(const b of BTNS){
    const g=document.getElementById('b-'+b.id);if(!g)continue;
    g.classList.toggle('live',on.has(b.id));
    if(b.stick){
      const c=g.querySelector('circle:not(.s)');if(!c)continue;
      const dx=ev.v?((b.id==='LS'?ev.s[0]:ev.s[2])-128)/128*b.r*.45:0,dy=ev.v?((b.id==='LS'?ev.s[1]:ev.s[3])-128)/128*b.r*.45:0;
      c.setAttribute('cx',b.x+dx);c.setAttribute('cy',b.y+dy);
    }
  }
}
setInterval(()=>{try{if(PM.connected()&&!document.hidden)PM.sendLine('live 1').catch(()=>{});if(Date.now()-liveSeen>12000)livePad({v:0,b:0,s:[128,128,128,128],t:[0,0]});}catch(e){}},3000);
function applyState(st){
  const prev=cardState;cardState=st;
  if(PM.link.info){PM.link.info.mapping=st.mapping;PM.link.info.prof=st.prof;}
  if(cardBT){cardBT.route=st.route;}
  if(st.prof<S.profiles.length&&st.prof!==S.cur&&cardSynced()){S.cur=st.prof;ui.layer=0;render();}
  if(prev&&prev.path!==st.path){
    if(st.path===0&&prev.path===2&&st.route===1)toast('Bluetooth hedefi bulunamadı, tuşlar kabloya döndü');
    if(st.path===1)PM.sendLine('targets').catch(()=>{});
  }
  if(prev&&prev.pad!==st.pad)toast(st.pad?'Pad bağlandı':'Pad bağlantısı koptu');
  renderCard();
  clearTimeout(stT);stT=setTimeout(()=>{if(document.getElementById('sheet').classList.contains('open'))renderSheet();},150);
}
function stateText(){
  const s=cardState;if(!s)return '';
  const parts=[];
  if(!s.pad)parts.push('pad yok');
  if(s.path===1)parts.push('📶 '+(cardBT&&cardBT.host?tName(cardBT.host):'Bluetooth'));
  else if(s.path===2)parts.push('📶 aranıyor');
  else if(s.route===1)parts.push('🔌 kabloya döndü');
  if(!s.mapping)parts.push('🎮 eşleme kapalı');
  else if(s.layer>0)parts.push(LAYER_NAMES[s.layer]);
  return parts.length?' · '+parts.join(' · '):'';
}

/* ---------- Güncelleme ---------- */
const APK_URL='https://github.com/ImLegennD/padmapper/releases/download/son-surum/padmapper-ayar.apk';
const vnum=v=>String(v||'0').split('.').map(x=>parseInt(x)||0).reduce((a,x)=>a*1000+x,0);
const bundledFw=()=>PM.native&&PMNative.assetText?PMNative.assetText('fw_version.txt'):'';
function cardNeedsUpdate(){const i=PM.link.info,b=bundledFw();return !!(PM.connected()&&i&&i.fw&&b&&vnum(b)>vnum(i.fw));}
function updHtml(){
  if(!PM.native)return srow('Uygulama ve kart','<button class="btn" onclick="openLink(\'https://github.com/ImLegennD/padmapper/releases/tag/son-surum\')">İndirme sayfası</button>');
  const i=PM.link.info||{},b=bundledFw(),need=cardNeedsUpdate();
  return srow('Uygulama <span class="hint">'+esc(PMNative.version())+'</span>','<button class="btn" onclick="updApp()">Güncelle</button>','Tarayıcında GitHub\'a giriş yapmış olman gerekir. İndirme bitince aç → Güncelle. Profillerin korunur. Yeni uygulama yeni kart yazılımını da içinde getirir.')+
    srow('Kart yazılımı <span class="hint">'+(PM.connected()?'kartta '+esc(i.fw||'?')+' · ':'')+'uygulamada '+esc(b||'?')+'</span>',
      `<button class="btn ${need?'pri':''}" ${PM.connected()&&b&&PM.link.kind==='native'&&PM.link.via!=='ble'?'':'disabled'} onclick="updCard()">${need?'Yeni sürümü kur':'Yeniden kur'}</button>`,
      (PM.link.via==='ble'?'<b>Kart yazılımı sadece USB ile kurulur:</b> kartı telefona tak. ':'')+'Kart yükleme moduna geçer, uygulama yazılımı karta yazar, kart yeniden başlar. Ayarların ve profillerin kartta kalır. Yarıda kesilirse kart bozulmaz; tekrar denersin.');
}
/* tam ekran güncelleme penceresi: bu sırada başka hiçbir şey çalışmaz */
let updating=false;
function updModal(steps,cur,p,msg,btns){
  let d=document.getElementById('upd');
  if(!d){d=document.createElement('div');d.id='upd';d.className='sheet open';d.style.zIndex=40;document.body.appendChild(d);}
  d.innerHTML=`<div class="in" style="max-width:420px"><h2 style="margin:0 0 12px">Kart güncelleniyor</h2>
    ${steps.map((s,k)=>`<div class="row" style="margin:6px 0;opacity:${k>cur?.45:1}"><span style="width:22px;text-align:center">${k<cur?'✓':k===cur?(btns?'⚠':'<span class="spin"></span>'):'○'}</span><span style="flex:1">${s}</span></div>`).join('')}
    ${p!=null?`<div style="height:8px;background:var(--panel2);border-radius:4px;margin:12px 0 4px"><i style="display:block;height:8px;border-radius:4px;background:var(--acc);width:${p}%"></i></div><div class="hint">%${p}</div>`:''}
    ${msg?`<p class="hint" style="margin:10px 0 0">${msg}</p>`:''}
    ${btns?`<div class="sbtns">${btns}</div>`:'<p class="hint" style="margin:10px 0 0">Kartı çıkarma, uygulamayı kapatma.</p>'}</div>`;
}
function updClose(){updating=false;const d=document.getElementById('upd');if(d)d.remove();}
const UPD_STEPS=['Kart yükleme moduna geçiyor','Kartın sürücüsü bekleniyor','Yeni yazılım yazılıyor','Kart yeniden başlıyor','Bitti'];
async function updCard(skip){
  if(updating)return;
  if(!skip&&!await ask('Kart yazılımı '+bundledFw()+' kurulsun mu?\n\nKart güncelleme moduna geçer ve telefona USB bellek gibi görünür. Açılan dosya ekranında sol menüden XIAO belleğini seçip "Bu klasörü kullan"a basman gerekir.\n\nXIAO belleği listede yoksa telefonun onu göremiyordur: Vazgeç de, kartı çıkarıp tak (eski yazılımla açılır) ve kartı bilgisayardan güncelle.',null))return;
  updating=true;closeSheet();
  const want=bundledFw();
  updModal(UPD_STEPS,0);
  try{await PM.sendLine('dfu');}catch(e){}
  await new Promise(r=>setTimeout(r,1500));
  try{await PM.disconnect();}catch(e){}
  updModal(UPD_STEPS,1,null,'İlk seferde Android, kartın sürücüsüne erişim izni ister.');
  window.PM_native.drive=ok=>{if(ok)PMNative.flashUf2();else updModal(UPD_STEPS,1,null,'Sürücü seçilmedi.',`<button class="btn pri" onclick="PMNative.pickDrive()">Sürücüyü seç</button><button class="btn" onclick="updClose()">Vazgeç</button>`);};
  window.PM_native.flash=ev=>{
    if(ev.state==='wait')updModal(UPD_STEPS,1);
    else if(ev.state==='nodrive')updModal(UPD_STEPS,1,null,'Açılan kart sürücüsünü seç (adı genelde <b>XIAO</b> ile başlar), sonra <b>Bu klasörü kullan</b> de. Bu izin bir kere istenir.<br><br><b>XIAO belleği listede yoksa</b> telefonun onu göremiyor: Vazgeç de, kartı çıkarıp tak (eski yazılımla açılır) ve bilgisayardan güncelle.',`<button class="btn pri" onclick="PMNative.pickDrive()">Sürücüyü seç</button><button class="btn" onclick="updClose()">Vazgeç</button>`);
    else if(ev.state==='write')updModal(UPD_STEPS,2,ev.p);
    else if(ev.state==='err')updModal(UPD_STEPS,2,ev.p,'Yazılamadı: '+esc(ev.msg||'')+'. Kart bozulmaz; kartı çıkarıp takıp tekrar dene ya da bilgisayardan UF2 at.',`<button class="btn pri" onclick="PMNative.flashUf2()">Tekrar dene</button><button class="btn" onclick="updClose()">Kapat</button>`);
    else if(ev.state==='done'){
      updModal(UPD_STEPS,3,100);
      const t0=Date.now();
      const chk=setInterval(async()=>{
        if(PM.connected()&&PM.link.info){clearInterval(chk);const ok=vnum(PM.link.info.fw)>=vnum(want);
          updModal(UPD_STEPS,ok?5:4,null,ok?'Kart yazılımı '+esc(PM.link.info.fw)+' kuruldu ✓':'Kart bağlandı ama sürümü '+esc(PM.link.info.fw)+'.',`<button class="btn pri" onclick="updClose()">Tamam</button>`);}
        else if(!PM.connected()&&PMNative.present()){try{await PM.connect({native:true});}catch(e){}}
        if(Date.now()-t0>40000){clearInterval(chk);updModal(UPD_STEPS,3,null,'Kart henüz geri bağlanmadı. Kartı çıkarıp tak.',`<button class="btn" onclick="updClose()">Kapat</button>`);}
      },1500);
    }
  };
  PMNative.flashUf2();
}
function updApp(){
  updModal(['Tarayıcıda indiriliyor','İndirme bitince bildirime dokun ya da İndirilenler\'den aç','Android sorunca Güncelle de'],0,null,'İndirme tarayıcıda olur, ilerlemesini orada görürsün. Profillerin ve ayarların korunur. Yeni uygulama açılınca kart eskiyse kart güncellemesini önerir.',`<button class="btn pri" onclick="openLink(APK_URL)">Tarayıcıda indir</button><button class="btn" onclick="updClose()">Kapat</button>`);
  document.querySelector('#upd h2').textContent='Uygulama güncellemesi';
}

/* ---------- Tuşlar nereye: kablo / Bluetooth hedefleri ---------- */
let cardBT=null;
const tName=a=>(S.device.tnames&&S.device.tnames[a])||('Bluetooth cihaz '+String(a).replace(/ \(.*\)$/,'').slice(-5));
const NOCONN='<div class="card"><p style="margin:0 0 10px">Bunun için önce karta bağlanman gerekiyor.</p><button class="btn pri" style="width:100%" onclick="closeSheet();cardBtn()">Karta bağlan</button></div>';
function routeHtml(){
  if(!PM.connected())return NOCONN;
  if(0)return '<p class="hint" style="margin:0">Karta bağlanınca burada seçilir. Seçim kartta saklanır; uygulama kapalıyken de geçerlidir.</p>';
  if(!cardBT)return '<p class="hint" style="margin:0">Kart yazılımı Bluetooth çıkışı desteklemiyor. Kartı güncelle.</p>';
  const bt=cardBT.route===1,st=cardState||{};
  const rad=on=>`<span class="rad ${on?'on':''}"><i></i></span>`;
  const stbox=(col,ico,t,s)=>`<div class="stbox">${ico}<div class="grow"><div style="font-size:12px;font-weight:600;color:${col}">${t}</div><div class="hint" style="font-size:11px">${s}</div></div></div>`;
  let now='';
  if(!bt){
    if(st.path===0&&st.usb)now=stbox('var(--l2)',IC_USB,'Şu an: USB veri bağlantısı (OTG)','Kart bir bilgisayara ya da tablete takılı → tuşlar kablodan gidiyor');
    else if(st.path===1)now=stbox('var(--mute)',IC_BT,'Sadece güç (veri yok) → Bluetooth: '+esc(cardBT.host?tName(cardBT.host):'hedef'),'Hata değil; kart kablodan güç alıyor, tuşlar Bluetooth\'tan gidiyor');
    else now=stbox('var(--warn)',IC_BT,'Sadece güç → Bluetooth hedefi aranıyor…','Seçili cihazın Bluetooth\'u açık mı?');
  }
  let h=`<div class="card" style="padding:4px 14px 12px">
    <button class="li2 lnk" onclick="setRoute(0)">${rad(!bt)}<span class="obox">${IC_BOLT}</span><span class="otx"><b>Otomatik</b><small>Veri kablosu varsa kablo, yoksa Bluetooth</small></span></button>
    ${now}
    <p class="lbl" style="margin:12px 0 0">Bluetooth cihazları</p>
    ${(cardBT.list||[]).map(a=>{const sel=a===cardBT.target,on=a===cardBT.host;
      return `<div class="li2"><button class="lnk row grow" style="gap:10px" onclick="pickTarget('${a}')">${rad(bt&&sel)}<span class="obox" style="color:${on?'var(--acc)':'var(--mute)'}">${IC_BT}</span><span class="otx"><b>${esc(tName(a))}</b><small>${on?'<span class="ok">bağlı</span>':sel?'seçili':'eşli'}</small></span></button><button class="btn ico sm" aria-label="Adını değiştir" onclick="renameTarget('${a}')">✎</button><button class="btn ico sm" aria-label="Unut" onclick="unpairTarget('${a}')">✕</button></div>`;}).join('')||'<p class="hint" style="margin:8px 0">Eşli Bluetooth cihazı yok.</p>'}
    ${bt?'':`<button class="li2 lnk" onclick="setRoute(1)">${rad(false)}<span class="otx"><b>Her zaman Bluetooth</b><small>Kablo takılı olsa bile seçili Bluetooth cihazına</small></span></button>`}
    ${bt?`<button class="li2 lnk" onclick="setRoute(1)">${rad(true)}<span class="otx"><b>Her zaman Bluetooth</b><small>Otomatiğe dönmek için yukarıdaki Otomatik'e dokun</small></span></button>`:''}
  </div>
  <button class="btn ${cardBT.pairing?'':'pri'}" style="width:100%;margin-top:10px" onclick="pairNew()" ${cardBT.pairing?'disabled':''}>${cardBT.pairing?'<span class="spin"></span> Kart görünür · 60 sn':'＋ Cihaz ekle (Bluetooth)'}</button>
  <p class="hint" style="margin:8px 0 0">Cihaz ekle'ye dokununca kart 60 sn görünür olur. Yeni cihazın Bluetooth ayarlarında "PadMapper"ı seç; listeye eklenir ve çıkış ona geçer.</p>`;
  return h;
}
async function setRoute(r){await PM.sendLine('route '+r);}
async function pickTarget(a){if(a===cardBT.target)return;await PM.sendLine('target '+a);toast(tName(a)+' seçildi');}
async function pairNew(){await PM.sendLine('pair');toast('Hedef cihazın Bluetooth ayarlarında PadMapper\'ı seç');}
async function renameTarget(a){const n=await ask('Bu cihazın adı:',tName(a));if(n==null)return;S.device.tnames=S.device.tnames||{};S.device.tnames[a]=n||undefined;save();renderSheet();}
async function unpairTarget(a){if(!await ask(`"${tName(a)}" unutulsun mu? Tekrar kullanmak için yeniden eşlemen gerekir.`,null))return;await PM.sendLine('unpair '+a);}

/* ---------- Karttan profilleri alma ---------- */
const isFresh=()=>S.profiles.length===1&&snap(S.profiles[0])===snap(migrate(demoProf()));
let cardChecked=false;
async function cardProfilesCheck(){
  const i=PM.link.info;if(!i||cardChecked||card.busy||updating)return;cardChecked=true;
  if(!(i.jlen||i.cfg)||cardSynced())return;
  if(isFresh()){await takeFromCard(true);return;}
  toast('Karttaki ayarlar buradakinden farklı. ⚙ → Kart bölümünden karttakileri alabilir ya da buradakileri yazabilirsin');
}
async function takeFromCard(auto){
  try{
    const r=await PM.readCard();if(!r){toast('Kartta kayıtlı ayar yok');return;}
    if(!auto&&!await ask(`Kartta ${r.state.profiles.length} profil var. Buradaki profillerin yerine alınsın mı?`+(r.full?'':' (Bu kartta profil adları saklanmamış; Profil 1, 2… olarak gelir.)'),null))return;
    loadBackupDirect(r.state);
    if(PM.link.info&&PM.link.info.prof<S.profiles.length){S.cur=PM.link.info.prof;render();}
    toast('Profiller karttan alındı'+(r.full?'':' (adları Profil 1, 2…)'));renderCard();
    if(document.getElementById('sheet').classList.contains('open'))renderSheet();
  }catch(e){toast('Karttan okunamadı: '+(e.message||e));}
}

/* ---------- Paylaş / yedek ---------- */
const stamp=()=>new Date().toISOString().slice(0,10);
function exportState(){const c=JSON.parse(JSON.stringify(S));c.profiles.forEach(p=>{if(p._applied){const a=JSON.parse(p._applied);a.name=p.name;Object.assign(p,a);}delete p._applied;});return c;}
function downloadText(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
async function shareHtml(){
  const st=JSON.stringify(exportState());
  if(PM.native){if(!PMNative.shareHtml('padmapper-ayar.html',st))toast('Paylaşılamadı');return;}
  try{
    const r=await fetch(location.href);let src=await r.text();
    src=src.replace(/<script>window\.PM_PRESET=[\s\S]*?<\/script>/,'');
    const inj='<script>window.PM_PRESET='+st.replace(/<\//g,'<\\/')+';<\/script>';
    src=src.includes('<head>')?src.replace('<head>','<head>'+inj):inj+src;
    downloadText('padmapper-ayar.html',src,'text/html');
  }catch(e){toast('Bu tarayıcıda dosya oluşturulamadı; uygulamadan paylaş');}
}
function backupProfiles(){
  const t=JSON.stringify({padmapper:1,tarih:new Date().toISOString(),ayar:exportState()},null,1),n='padmapper-yedek-'+stamp()+'.json';
  if(PM.native){if(!PMNative.shareText(n,t))toast('Paylaşılamadı');}else downloadText(n,t,'application/json');
}
function loadBackup(text){
  let d;try{d=JSON.parse(text);}catch(e){toast('Dosya okunamadı');return;}
  let st=d&&d.ayar?d.ayar:d;
  if(Array.isArray(st))st={profiles:st};
  else if(st&&st.layers)st={profiles:[st]};
  if(st&&st.profiles)st.device=Object.assign({},JSON.parse(JSON.stringify(S.device)),st.device||{});
  if(!st||!st.profiles||!st.profiles.length){toast('Bu dosyada PadMapper profili bulunamadı');return;}
  st.profiles.forEach((p,i)=>{if(!p.name)p.name='Profil '+(i+1);});
  ask(`Yedekte ${st.profiles.length} profil var (${st.profiles.map(p=>p.name).join(', ')}). Şimdiki profillerin yerine yüklensin mi?`,null).then(ok=>{
    if(!ok)return;S=st;S.profiles.forEach(migrate);S.profiles.forEach(p=>p._applied=snap(p));S.cur=Math.min(S.cur||0,S.profiles.length-1);
    if(!S.device.profMod){S.device.profMod='HOME';S.device.profPrev='LB';S.device.profNext='RB';}
    ui.layer=0;save();render();if(document.getElementById('sheet').classList.contains('open'))renderSheet();toast('Yedek yüklendi'+(PM.connected()?', "Karta yaz" ile karta gönder':''));});
}
function importProfiles(){
  if(PM.native){window.PM_native.picked=t=>{if(t)loadBackup(t);else toast('Dosya seçilmedi ya da okunamadı');};PMNative.pickFile();return;}
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(f)f.text().then(loadBackup);};i.click();
}
function shareUf2(){if(!PMNative.hasAsset('padmapper.uf2')){toast('Bu uygulama sürümünde kart yazılımı yok');return;}if(!PMNative.shareAsset('padmapper.uf2','padmapper.uf2'))toast('Paylaşılamadı');}
function shareApk(){if(!PMNative.shareApk())toast('Paylaşılamadı');}
function openLink(u){if(PM.native)PMNative.openUrl(u);else window.open(u,'_blank','noopener');}

drawPad();render();
if(presetPending)setTimeout(()=>ask(`Bu ayar ekranı ${presetPending.profiles.length} profille geldi (${presetPending.profiles.map(p=>p.name).join(', ')}). Bu bilgisayardaki profillerin yerine kullanılsın mı?`,null).then(ok=>{if(ok){loadBackupDirect(presetPending);}}),300);
function loadBackupDirect(st){st=JSON.parse(JSON.stringify(st));st.device=Object.assign({},S.device,st.device||{});if(S.theme&&!st.theme)st.theme=S.theme;S=st;if(!S.device.profMod){S.device.profMod='HOME';S.device.profPrev='LB';S.device.profNext='RB';}S.profiles.forEach(migrate);S.profiles.forEach(p=>p._applied=snap(p));S.cur=Math.min(S.cur||0,S.profiles.length-1);ui.layer=0;save();render();toast('Profiller yüklendi');}
/* sayfa açılınca ya da kart takılınca, daha önce izin verildiyse kendiliğinden bağlan */
PM.findKnown().then(k=>{if(k)cardBtn(k);}).catch(()=>{});
PM.onPlug(k=>setTimeout(()=>cardBtn(k),800));
</script>
