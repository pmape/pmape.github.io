<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PadMapper – XIAO reWASD tarzı eşleme</title>
<style>
:root{
  --bg:#121419; --panel:#1b1e25; --panel2:#242833; --line:#2f3442; --text:#e8eaef; --mute:#8b93a5;
  --acc:#ff8a3d; --acc2:#3dd6c6; --l1:#ff5d6c; --l2:#5fd36a; --l3:#5b9bff; --warn:#ffcc4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
select,input[type=number],input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;min-height:36px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ico{width:38px;padding:0;font-size:18px}
.hint{color:var(--mute);font-size:13px}

/* üst */
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:6px;align-items:center;margin-left:auto}
.acts .st8{font-size:13px;white-space:nowrap;padding:0 4px}
.dirty{color:var(--warn)}.clean{color:var(--l2)}
header b{color:var(--acc);font-size:16px;white-space:nowrap}
header select{flex:1;min-width:0;max-width:240px}
@media (max-width:520px){header b{display:none}}
.st.off{opacity:.45}
.layers{display:flex;gap:4px;width:100%}
.layers button{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:5px 11px;min-height:34px;cursor:pointer;font-size:13px;white-space:nowrap}
.layers button.on{color:#111;font-weight:700}
.layers button.on[data-l="0"]{background:var(--acc);border-color:var(--acc)}
.layers button.on[data-l="1"]{background:var(--l1);border-color:var(--l1)}
.layers button.on[data-l="2"]{background:var(--l2);border-color:var(--l2)}
.layers button.on[data-l="3"]{background:var(--l3);border-color:var(--l3)}
@media (max-width:620px){.layers button{flex:1}.acts{width:100%;margin-left:0}.acts .sp{flex:1}}

main{align-items:start;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px;max-width:1200px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}

/* kontrolcü */
svg{width:100%;height:auto;display:block;max-height:46vh}
.grip{fill:#232835;stroke:#394052;stroke-width:2}
.b{cursor:pointer}
.b .s{fill:#323846;stroke:#4a5266;stroke-width:2}
.b.map .s{fill:#5a3a22;stroke:var(--acc)}
.b.inh .s{fill:#332e25;stroke:#7a6a4a;stroke-dasharray:4 3}
.b.sel .s{stroke:#fff;stroke-width:3}
.lb{font-size:10.5px;font-weight:600;fill:var(--acc2);pointer-events:none;dominant-baseline:central}
.lb.inh{fill:#9a8a62}
.b text{fill:var(--text);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
details.sum{margin-top:6px}
details.sum summary{cursor:pointer;color:var(--mute);font-size:13px;padding:4px 2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px;cursor:pointer}
.chip b{color:var(--mute);font-weight:600;margin-right:4px}

/* editör */
.ehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ehead h2{font-size:17px;margin:0}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.scroll{display:flex;gap:5px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pill{position:relative;flex:none;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:5px 12px;min-height:34px;cursor:pointer;font-size:13px}
.pill.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.pill .dot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--acc2)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel2);padding:6px 8px;min-height:36px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:#1a1205;font-weight:700}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* makro */
.mac{display:flex;flex-direction:column}
.st{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 6px}
.st .n{width:18px;text-align:center;color:var(--mute);font-size:12px;flex:none}
.st select{flex:1;min-width:0}
.st .a{flex:0 0 108px}
.st .ty{flex:0 0 52px;padding:4px 2px;text-align:center}
.x{background:none;border:0;color:var(--mute);cursor:pointer;width:30px;height:32px;border-radius:7px;font-size:15px;flex:none}
.x:hover{color:var(--text);background:var(--bg)}
.gap{display:flex;align-items:center;gap:6px;padding:3px 0 3px 26px;color:var(--mute);font-size:13px}
.gap::before{content:"";width:2px;height:26px;background:var(--line);margin-right:6px}
.gap input{width:76px;min-height:32px;padding:3px 6px;text-align:right}
.gap .x{width:30px;height:30px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.gap.loop{color:var(--acc2)}
.gap.loop::before{background:var(--acc2)}
.empty{color:var(--mute);font-size:13px;padding:6px 2px}
.explain{background:#17231f;border:1px solid #28463c;color:#bfeee2;border-radius:9px;padding:7px 10px;font-size:13px;margin-top:10px}
.note{background:#2a2414;border:1px solid #5a4a1f;color:#f3dfa6;border-radius:9px;padding:7px 10px;font-size:13px;margin-top:8px}
.k{display:inline-block;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px;margin:0 1px;font-family:ui-monospace,Consolas,monospace}
.rec{background:#5a1f26!important;border-color:var(--l1)!important}
input[type=range]{accent-color:var(--acc);flex:1;min-width:120px}
.dir{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dir label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}

/* ayarlar paneli */
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:12px 14px 20px}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:16px}}
.dev{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;cursor:pointer}
.dev:hover{border-color:var(--acc)}
.dev.act{border-color:var(--acc2)}
.dev .r{color:var(--acc2);font-size:16px;width:18px;text-align:center}
.dev .ic{font-size:22px;width:28px;text-align:center}
.dev.no{opacity:.5;cursor:default}
.dev.no:hover{border-color:var(--line)}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:middle}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i.on{background:var(--acc2)}
.ok{color:var(--l2);font-size:12px}.bad{color:var(--mute);font-size:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc2);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.prev{font-size:11px;padding:2px 8px;border-radius:20px;background:#3a2f12;color:var(--warn);border:1px solid #5a4a1f}
.sheet h2{font-size:17px;margin:0;flex:1}
.sec{border-top:1px solid var(--line);padding-top:4px;margin-top:10px}
textarea{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
#card{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#card .dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
#card .dot.on{background:var(--l2)}#card .dot.warn{background:var(--warn)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--acc2);color:#062a26;padding:8px 16px;border-radius:9px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
</style>
</head>
<body>
<header>
  <b>PadMapper</b>
  <select id="profSel" title="Profil"></select>
  <select id="outSel" title="Tablet bu cihazı ne olarak görsün (bu profil için)"></select>
  <button class="btn" id="card" onclick="cardBtn()" title="Karta bağlan / bağlantıyı kes"><span class="dot"></span><span id="cardTxt">Kart</span></button>
  <button class="btn ico" title="Ayarlar" onclick="openSheet()">⚙</button>
  <div class="acts" id="acts"></div>
  <div class="layers" id="layers"></div>
</header>

<main>
  <section class="card">
    <svg viewBox="0 0 640 292" id="pad"></svg>
    <details class="sum" id="sumBox"><summary id="sumTitle"></summary><div class="chips" id="summary"></div></details>
  </section>
  <section class="card" id="panel"></section>
</main>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<div class="sheet" id="scan" onclick="if(event.target===this)closeScan()"><div class="in" id="scanIn"></div></div>
<div id="toast"></div>

<script>
/* PadMapper: profilleri kartın anladığı biçime çevir + karta bağlan (bilgisayar: WebSerial, Android: WebUSB).
 * Biçim firmware/src/engine.h'de. */
const PM = (() => {
  const HID = {};
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((c, i) => HID['Key' + c] = 4 + i);
  '1234567890'.split('').forEach((c, i) => HID['Digit' + c] = 30 + i);
  for (let i = 1; i <= 12; i++) HID['F' + i] = 57 + i;
  Object.assign(HID, {
    Enter: 40, Escape: 41, Backspace: 42, Tab: 43, Space: 44, Minus: 45, Equal: 46, BracketLeft: 47,
    BracketRight: 48, Backslash: 49, Semicolon: 51, Quote: 52, Backquote: 53, Comma: 54, Period: 55,
    Slash: 56, CapsLock: 57, Insert: 73, Home: 74, PageUp: 75, Delete: 76, End: 77, PageDown: 78,
    ArrowRight: 79, ArrowLeft: 80, ArrowDown: 81, ArrowUp: 82, IntlBackslash: 100,
    ControlLeft: 0xe0, ShiftLeft: 0xe1, AltLeft: 0xe2, MetaLeft: 0xe3,
    ControlRight: 0xe4, ShiftRight: 0xe5, AltRight: 0xe6,
  });
  for (let i = 1; i <= 9; i++) HID['Numpad' + i] = 88 + i;
  HID.Numpad0 = 98;

  const BTN = { A: 0, B: 1, X: 3, Y: 4, LB: 6, RB: 7, LT: 8, RT: 9, SELECT: 10, START: 11, HOME: 12,
    L3: 13, R3: 14, SHARE: 15, UP: 16, DOWN: 17, LEFT: 18, RIGHT: 19, M1: 20, M2: 21 };
  const MOUSE = { left: 0, right: 1, middle: 2, back: 3, fwd: 4, wheelUp: 5, wheelDown: 6 };
  const OUT = { kbm: 0, kb: 1, pad: 2, all: 3 };
  const SM = { inherit: 0, off: 1, mouse: 2, keys: 3, scroll: 4, pad: 5 };
  const TRIG = { single: 0, double: 1, long: 2, start: 3, release: 4 };
  const MODE = { normal: 0, turbo: 1, toggle: 2 };
  const ACTS = { press: 0, down: 1, up: 2 };

  function compile(S) {
    const b = [];
    const u8 = v => b.push(v & 255);
    const u16 = v => { v = Math.max(0, Math.min(65535, Math.round(+v || 0))); b.push(v & 255, v >> 8); };
    const d = S.device;
    const profs = S.profiles.map(p => p._applied ? JSON.parse(p._applied) : p).slice(0, 8);
    b.push(80, 77, 1);
    u8(d.startMode === 'pad' ? 1 : 0);
    u8(BTN[d.comboA] ?? 12); u8(BTN[d.comboB] ?? 10);
    u16(d.holdMs || 1500);
    u8((d.profSwitch ? 1 : 0) | (d.passUnmapped !== false ? 2 : 0));
    u8(profs.length); u8(0); u8(0); /* seçili profil ayrıca 'cs' ile gider */
    for (const p of profs) {
      u8(OUT[p.output || 'all']); u8(p.trigThr ?? 30); u16(p.longMs || 300); u16(p.doubleMs || 250);
      for (const l of p.layers) for (const s of ['LS', 'RS']) {
        const st = l.sticks[s] || { mode: 'off' };
        u8(SM[st.mode] ?? 1); u8(st.sens || 8); u8(st.dead ?? 12);
        for (const k of ['up', 'down', 'left', 'right']) u8(HID[st.keys && st.keys[k]] || 0);
      }
      const binds = [];
      p.layers.forEach((l, li) => {
        for (const id in l.btn) {
          if (BTN[id] === undefined) continue;
          for (const k in l.btn[id]) {
            const a = l.btn[id][k];
            if (!a || !(a.kind === 'layer' || (a.steps && a.steps.length))) continue;
            let trig, other = 255;
            if (k.startsWith('c_')) { trig = 5; other = BTN[k.slice(2)]; if (other === undefined) continue; }
            else { trig = TRIG[k]; if (trig === undefined) continue; }
            binds.push({ li, btn: BTN[id], trig, other, a });
          }
        }
      });
      u16(binds.length);
      for (const { li, btn, trig, other, a } of binds) {
        const steps = a.kind === 'layer' ? [] : a.steps.slice(0, 255);
        u8(li); u8(btn); u8(trig); u8(other);
        u8(a.kind === 'layer' ? 1 : 0); u8(MODE[a.mode] || 0); u16(a.turbo || 80);
        u8(a.layer || 0); u8(a.how === 'toggle' ? 1 : 0); u8(steps.length);
        for (const s of steps) {
          if (s.t === 'key') { u8(0); u8(HID[s.k] || 0); }
          else if (s.t === 'mouse') { u8(1); u8(MOUSE[s.b] ?? 0); }
          else { u8(2); u8(BTN[s.p] ?? 0); }
          u8(ACTS[s.a] ?? 0); u16(s.after || 0);
        }
      }
    }
    return new Uint8Array(b);
  }

  const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(a) { let c = 0xffffffff; for (const x of a) c = CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  const hex = a => Array.from(a, x => x.toString(16).padStart(2, '0')).join('');

  /* ---------- bağlantı ---------- */
  const link = { kind: null, onLine: () => {}, onClose: () => {}, info: null };
  let buf = '', writer = null, usb = null, closing = false;
  const OLD = 'Kart komutlara cevap vermiyor. Karttaki yazılım eski olabilir: 0.3.0 padmapper.uf2 dosyasını yükle.';
  const enc = new TextEncoder(), dec = new TextDecoder();

  function feed(text) {
    buf += text;
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const l = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!l.startsWith('{')) continue;
      try { const ev = JSON.parse(l); if (ev.ev === 'hello') link.info = ev; link.onLine(ev); } catch (e) {}
    }
  }

  async function openSerial() {
    const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x2fe3 }] }).catch(() => navigator.serial.requestPort());
    await port.open({ baudRate: 115200 });
    try { await port.setSignals({ dataTerminalReady: true }); } catch (e) {}
    writer = port.writable.getWriter();
    link.kind = 'serial'; link.port = port;
    (async () => {
      const r = port.readable.getReader(); link.reader = r;
      try { for (;;) { const { value, done } = await r.read(); if (done) break; feed(dec.decode(value)); } }
      catch (e) {} finally { r.releaseLock(); if (!closing) link.onClose(); }
    })();
  }

  async function openUsb() {
    const dev = await navigator.usb.requestDevice({ filters: [] }); /* listede "PadMapper"ı seç */
    await dev.open();
    if (!dev.configuration) await dev.selectConfiguration(1);
    let ctrl = null, data = null, epIn = 0, epOut = 0;
    for (const itf of dev.configuration.interfaces) {
      const alt = itf.alternates[0];
      if (alt.interfaceClass === 2 && ctrl === null) ctrl = itf.interfaceNumber;
      if (alt.interfaceClass === 10 && data === null) {
        data = itf.interfaceNumber;
        for (const ep of alt.endpoints) { if (ep.type === 'bulk') { if (ep.direction === 'in') epIn = ep.endpointNumber; else epOut = ep.endpointNumber; } }
      }
    }
    if (data === null) throw new Error('Kartın seri bağlantısı bulunamadı');
    try { await dev.claimInterface(ctrl); } catch (e) {}
    await dev.claimInterface(data);
    const ctl = (req, val, body) => dev.controlTransferOut({ requestType: 'class', recipient: 'interface', request: req, value: val, index: ctrl }, body);
    try { await ctl(0x20, 0, new Uint8Array([0x00, 0xc2, 0x01, 0x00, 0, 0, 8])); } catch (e) {}
    try { await ctl(0x22, 1); } catch (e) {}
    usb = { dev, epIn, epOut };
    link.kind = 'usb';
    (async () => {
      try { for (;;) { const r = await dev.transferIn(epIn, 64); if (r.data && r.data.byteLength) feed(dec.decode(r.data)); } }
      catch (e) {} finally { if (!closing) link.onClose(); }
    })();
  }

  async function connect() {
    closing = false; link.info = null; buf = '';
    if ('serial' in navigator) await openSerial();
    else if ('usb' in navigator) await openUsb();
    else throw new Error('Bu tarayıcı karta bağlanamıyor. Chrome kullan.');
    for (let i = 0; i < 3 && !link.info; i++) {
      await sendLine('hello');
      await new Promise(r => setTimeout(r, 700));
    }
    return !!link.info;
  }

  async function sendLine(l) {
    const d = enc.encode(l + '\n');
    if (link.kind === 'serial') await writer.write(d);
    else if (link.kind === 'usb') for (let i = 0; i < d.length; i += 64) await usb.dev.transferOut(usb.epOut, d.slice(i, i + 64));
    else throw new Error('Kart bağlı değil');
  }

  async function disconnect() {
    closing = true;
    try {
      if (link.kind === 'serial') { try { await link.reader.cancel(); } catch (e) {} writer.releaseLock(); await link.port.close(); }
      else if (link.kind === 'usb') await usb.dev.close();
    } catch (e) {}
    link.kind = null; link.info = null;
  }

  function waitEv(name, ms) {
    return new Promise((res, rej) => {
      const prev = link.onLine;
      const t = setTimeout(() => { link.onLine = prev; rej(new Error('Kart cevap vermedi')); }, ms);
      link.onLine = ev => { prev(ev); if (ev.ev === name) { clearTimeout(t); link.onLine = prev; res(ev); } };
    });
  }

  async function writeConfig(S) {
    if (!link.info) {
      await sendLine('hello');
      await new Promise(r => setTimeout(r, 700));
      if (!link.info) throw new Error(OLD);
    }
    const blob = compile(S);
    const w = waitEv('cfg', 8000);
    await sendLine('cb ' + blob.length);
    for (let i = 0; i < blob.length; i += 200) { await sendLine('cd ' + hex(blob.slice(i, i + 200))); await new Promise(r => setTimeout(r, 15)); }
    await sendLine('ce ' + crc32(blob).toString(16).padStart(8, '0'));
    const r = await w;
    if (!r.ok) throw new Error('Kart ayarı kabul etmedi (' + (r.err || '?') + ')');
    await sendLine('cs ' + Math.min(S.cur, S.profiles.length - 1));
    return { len: blob.length, crc: crc32(blob) };
  }

  return { compile, crc32, hex, link, connect, disconnect, sendLine, writeConfig,
    connected: () => !!link.kind, OLD, supported: () => 'serial' in navigator || 'usb' in navigator };
})();
if (typeof module !== 'undefined') module.exports = PM;

</script>
<script>
/* ---------- Sabitler ---------- */
const LAYER_NAMES=['Ana','Shift 1','Shift 2','Shift 3'];
const ACTS=[['single','Tek basış'],['double','Çift basış'],['long','Uzun basış'],['start','Basma anı'],['release','Bırakma']];
const BTNS=[
  {id:'LT',name:'LT',sh:'r',x:40,y:6,w:130,h:22,t:'LT'},
  {id:'LB',name:'LB',sh:'r',x:40,y:32,w:130,h:20,t:'LB'},
  {id:'RT',name:'RT',sh:'r',x:470,y:6,w:130,h:22,t:'RT'},
  {id:'RB',name:'RB',sh:'r',x:470,y:32,w:130,h:20,t:'RB'},
  {id:'LS',name:'Sol analog',sh:'c',x:90,y:115,r:34,t:'L',stick:1},
  {id:'L3',name:'L3 (sol analoga basma)',sh:'r',x:70,y:155,w:40,h:20,t:'L3'},
  {id:'UP',name:'Yön yukarı',sh:'r',x:178,y:158,w:26,h:28,t:'▲'},
  {id:'DOWN',name:'Yön aşağı',sh:'r',x:178,y:212,w:26,h:26,t:'▼'},

function migrate(p){
  p.gapMs=p.gapMs||50;
  for(const l of p.layers)for(const id in l.btn)for(const k of Object.keys(l.btn[id])){
    const a=l.btn[id][k];if(!a||!a.steps)continue;
    const out=[];
    for(const s of a.steps){
      if(s.t==='wait'){if(out.length)out[out.length-1].after+=s.ms;continue;}
      if(s.t==='wheel'){out.push({t:'mouse',b:s.d>0?'wheelUp':'wheelDown',a:'press',after:s.after||0});continue;}
      out.push(Object.assign({after:0},s));
    }
    a.steps=out;
  }
  return p;
}

    h+=`<div class="st${ok(s.t)?'':' off'}"><span class="n">${i+1}</span>`;
    h+=`<select class="ty" title="Klavye / Fare / Gamepad" onchange="setType(${i},this.value)">${opt(TYPES,s.t)}</select>`;
    const actSel=`<select class="a" onchange="setStep(${i},'a',this.value)">${opt(KACT,s.a)}</select>`;
    if(s.t==='key')h+=keySel(s.k,`setStep(${i},'k',this.value)`)+actSel;
    else if(s.t==='mouse')h+=`<select onchange="setStep(${i},'b',this.value)">${opt(MOUSE,s.b)}</select>`+(s.b.startsWith('wheel')?'':actSel);
    else if(s.t==='pad')h+=`<select onchange="setStep(${i},'p',this.value)">${opt(PAD,s.p)}</select>`+actSel;
    h+=`<button class="x" title="Yukarı taşı" onclick="mv(${i},-1)">↑</button><button class="x" title="Sil" onclick="rm(${i})">✕</button></div>`;
    if(i<a.steps.length-1)h+=gapRow(s.after,`gap.bind(null,${i})`);
  });
  if(loop)h+=gapRow(a.turbo,'loopGap',true);
  h+=`</div><div class="row" style="margin-top:8px">
    ${['key','mouse','pad'].filter(ok).map(t=>`<button class="btn" onclick="add('${t}')">+ ${TYPE_NAME[t].replace(/^(\S+) (.)/,(m,a,b)=>a+' '+b.toUpperCase())}</button>`).join('')}
    <button class="btn ${rec?'rec':''}" onclick="toggleRec()" title="Bilgisayar klavyesinde basarak kaydet">${rec?'■ Durdur':'● Kaydet'}</button></div>`;
  if(a.steps.length>2)h+=`<div class="row" style="margin-top:6px"><span class="hint">Hepsinin arası</span><input type="number" id="allGap" min="0" max="60000" step="10" value="${P().gapMs}" style="width:84px"><span class="hint">ms</span><button class="btn" onclick="setAll()">Uygula</button></div>`;
  h+=`<div class="lbl">Tekrar</div><div class="seg"><button class="${a.mode==='normal'?'on':''}" onclick="curA().mode='normal';render()">Normal</button><button class="${a.mode==='turbo'?'on':''}" onclick="curA().mode='turbo';render()">Turbo</button><button class="${a.mode==='toggle'?'on':''}" onclick="curA().mode='toggle';render()">Toggle</button></div>`;
  if(b.id==='LT'||b.id==='RT')h+=`<div class="lbl">Tetik eşiği</div><div class="row"><input type="range" min="5" max="95" value="${P().trigThr}" oninput="P().trigThr=+this.value;this.nextElementSibling.textContent=this.value+'%'" onchange="render()"><span>${P().trigThr}%</span></div>`;
  h+=`<div class="explain">${explain(a,b)}</div>`;
  const bad=[...new Set(a.steps.filter(s=>!ok(s.t)).map(s=>TYPE_NAME[s.t]))];
  if(bad.length)h+=`<div class="note">Bu profilde tablet cihazı <b>${OUT_NAME[P().output||'all']}</b> olarak görüyor. Soluk satırlardaki ${bad.join(', ')} adımları gönderilmez. Üstteki seçiciden değiştirebilirsin.</div>`;
  el.innerHTML=h;
}
function explain(a,b){
  const an=actName(ui.act).toLowerCase();
  if(!a.steps.length)return `${esc(b.name)} için ${an} boş.`;
  const seq=a.steps.map(stepLabel).join(' › ');
  const single=a.steps.length===1&&a.steps[0].a==='press'&&!(a.steps[0].b||'').startsWith('wheel');
  if(a.mode==='turbo')return `Basılı durdukça ${seq} tekrar eder, her tekrar arası ${fmtMs(a.turbo)}.`;
  if(a.mode==='toggle')return single?`Bir bas: ${seq} basılı kalır. Bir daha bas: bırakılır.`:`Bir bas: ${seq} tekrar etmeye başlar. Bir daha bas: durur.`;
  if(single&&ui.act==='single')return `${esc(b.name)} basılıyken ${seq} de basılı kalır.`;
  if(ui.act.startsWith('c_'))return `${esc(b.t)} + ${esc(BY_ID[ui.act.slice(2)].t)} birlikte basılınca ${seq} bir kez gönderilir.`;
  return `${an.charAt(0).toUpperCase()+an.slice(1)} olunca ${seq} bir kez gönderilir.`;
}
function stickPanel(b){
  const st=L().sticks[b.id];
  const modes=[['off','Kapalı'],['mouse','🖱 Fare'],['keys','⌨ Tuşlar'],['scroll','Tekerlek'],['pad','🎮 Gamepad']];
  if(ui.layer>0)modes.unshift(['inherit','Ana gibi']);

  if(STICK_NEED[st.mode]&&!ok(STICK_NEED[st.mode]))h+=`<div class="note">Bu profilde tablet cihazı <b>${OUT_NAME[P().output||'all']}</b> olarak görüyor, bu çubuk ayarı çalışmaz. Başka bir seçenek seç.</div>`;
  if(st.mode==='mouse'||st.mode==='scroll')h+=`<div class="lbl">Hız</div><div class="row"><input type="range" min="1" max="30" value="${st.sens}" oninput="curS().sens=+this.value;this.nextElementSibling.textContent=this.value" onchange="render()"><span>${st.sens}</span></div>`;
  if(st.mode!=='inherit'&&st.mode!=='off')h+=`<div class="lbl">Ölü bölge</div><div class="row"><input type="range" min="0" max="50" value="${st.dead}" oninput="curS().dead=+this.value;this.nextElementSibling.textContent=this.value+'%'" onchange="render()"><span>${st.dead}%</span></div>`;
  if(st.mode==='keys'){
    const c=(d,n)=>`<label>${n}${keySel(st.keys[d],`curS().keys.${d}=this.value;render()`)}</label>`;
    h+=`<div class="lbl">Yönler</div><div class="dir"><span></span>${c('up','Yukarı')}<span></span>${c('left','Sol')}<span></span>${c('right','Sağ')}<span></span>${c('down','Aşağı')}<span></span></div>
      <div class="explain">Çapraza itince iki tuş birlikte basılır (W + D gibi).</div>`;
  }
  if(st.mode==='pad')h+=`<div class="explain">Çubuk tablete gamepad çubuğu olarak gider. Ölü bölge ayarı yine uygulanır.</div>`;
  if(st.mode==='mouse')h+=`<div class="explain">Çubuğu ittikçe imleç o yöne gider. Çok itersen hızlı gider.</div>`;
  h+=`<p class="hint" style="margin:10px 0 0">Analoga basma için çizimdeki ${b.id==='LS'?'L3':'R3'} düğmesine dokun.</p>`;
  return h;
}

/* ---------- Düzenleme ---------- */
function cur(){const l=L();return l.btn[ui.sel]||(l.btn[ui.sel]={});}
function curA(){const b=cur();return b[ui.act]||(b[ui.act]=act());}
function curS(){return L().sticks[ui.sel];}
function pick(id){ui.sel=id;if(ui.act==='_new'||ui.act.startsWith('c_'))ui.act='single';if(rec)stopRec();render();}
function hasExit(li){const l=P().layers[li];return Object.values(l.btn).some(bd=>Object.values(bd).some(a=>a&&a.kind==='layer'&&a.layer!==li));}
function add(t){
  const st=curA().steps,g=P().gapMs;
  if(st.length&&!st[st.length-1].after)st[st.length-1].after=g;
  st.push(newStep(t,g));
  render();
}
function newStep(t,after){return t==='key'?{t,k:'KeyZ',a:'press',after}:t==='mouse'?{t,b:'left',a:'press',after}:{t,p:'A',a:'press',after};}
function setType(i,t){const s=curA().steps;s[i]=Object.assign(newStep(t,s[i].after),{a:s[i].a||'press'});render();}
function rm(i){curA().steps.splice(i,1);render();}
function mv(i,d){const s=curA().steps,j=i+d;if(j<0||j>=s.length)return;[s[i],s[j]]=[s[j],s[i]];render();}
function setStep(i,k,v){curA().steps[i][k]=v;render();}
const clamp=v=>Math.max(0,Math.min(60000,Math.round(+v||0)));
const stepOf=v=>v>=1000?100:10;
function gap(i,d,v){const s=curA().steps[i];s.after=d?clamp(s.after+d*stepOf(s.after+(d<0?-1:0))):clamp(v);render();}
function loopGap(d,v){const a=curA();a.turbo=Math.max(10,d?clamp(a.turbo+d*stepOf(a.turbo+(d<0?-1:0))):clamp(v));render();}
function setAll(){const ms=clamp(document.getElementById('allGap').value);P().gapMs=ms;curA().steps.forEach(s=>s.after=ms);render();toast('Hepsinin arası '+fmtMs(ms));}
function toggleRec(){rec?stopRec():(rec={t:0,steps:[]});render();}
function stopRec(){
  const st=rec.steps,out=[];
  for(let i=0;i<st.length;i++){
    const s=st[i],n=st[i+1];
    if(s.a==='down'&&n&&n.a==='up'&&n.k===s.k&&s.after<=150){out.push({t:'key',k:s.k,a:'press',after:n.after});i++;continue;}
    out.push(s);
  }
  if(out.length)out[out.length-1].after=out[out.length-1].after||P().gapMs;
  curA().steps.push(...out);rec=null;render();
}
function recEv(e,a){
  e.preventDefault();if(e.repeat)return;
  const now=performance.now();
  if(rec.steps.length)rec.steps[rec.steps.length-1].after=Math.round(now-rec.t);
  rec.steps.push({t:'key',k:e.code,a,after:0});rec.t=now;
  if(a==='down')toast('Kayıt: '+keyName(e.code));
}
document.addEventListener('keydown',e=>{if(rec)recEv(e,'down');});
document.addEventListener('keyup',e=>{if(rec)recEv(e,'up');});

function cardLine(){
  if(!PM.supported())return 'Bu tarayıcı karta bağlanamıyor. Chrome kullan.';
  if(!PM.connected())return 'Kart bağlı değil. Kartı USB ile bu cihaza tak, "Karta bağlan"a bas.';
  if(!PM.link.info)return PM.OLD;
  const i=PM.link.info||{};
  return `Bağlı · kart yazılımı ${i.fw||'?'} · ${card.busy?'yazılıyor…':cardSynced()?'karttaki ayar güncel ✓':i.cfg?'karttaki ayar farklı, "Karta yaz"a bas':'kartta henüz ayar yok'}`;
}
function renderCard(){
  const d=document.querySelector('#card .dot'),t=document.getElementById('cardTxt');if(!d)return;
  const c=PM.connected(),s=c&&cardSynced();
  d.className='dot '+(!c?'':card.busy?'warn':s?'on':'warn');
  t.textContent=!c?'Kart':card.busy?'Yazılıyor…':s?'Kart ✓':'Kart ●';
  document.getElementById('card').title=cardLine();
}
async function cardBtn(){
  if(PM.connected()){await PM.disconnect();renderCard();if(document.getElementById('sheet').classList.contains('open'))renderSheet();toast('Kart bağlantısı kesildi');return;}
  try{
    PM.link.onLine=ev=>{
      if(ev.ev==='prof'&&ev.cur<S.profiles.length&&ev.cur!==S.cur){S.cur=ev.cur;ui.layer=0;render();toast('Profil: '+P().name);}
      if(ev.ev==='mode')toast(ev.mapping?'Eşleme açık':'Normal gamepad');
      if(ev.ev==='hello'){renderCard();if(document.getElementById('sheet').classList.contains('open'))renderSheet();}
    };
    PM.link.onClose=()=>{renderCard();toast('Kart bağlantısı koptu');};
    const ok=await PM.connect();
    if(!ok){toast(PM.OLD);renderCard();return;}
    toast('Karta bağlandı · kart yazılımı '+PM.link.info.fw);
    setTimeout(()=>{renderCard();if(PM.link.info&&!cardSynced())toast('Karttaki ayar farklı. "Karta yaz"a bas');},600);
  }catch(e){if(e&&e.name!=='NotFoundError')toast(e.message||'Bağlanılamadı');}
  renderCard();
}
async function writeCard(){
  if(!PM.connected()){toast('Önce karta bağlan');return;}
  if(card.busy){card.again=true;return;}
  card.busy=true;renderCard();
  try{const r=await PM.writeConfig(S);if(PM.link.info)PM.link.info.crc=r.crc.toString(16);toast('Karta yazıldı ✓');}
  catch(e){toast(e.message||'Yazılamadı');}
  card.busy=false;renderCard();
  if(document.getElementById('sheet').classList.contains('open'))renderSheet();
  if(card.again){card.again=false;writeCard();}
}
let awT=null;
function autoWrite(){if(!PM.connected())return;clearTimeout(awT);awT=setTimeout(()=>{if(!cardSynced())writeCard();},700);}

drawPad();render();
</script>
