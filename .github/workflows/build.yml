name: Kart yazılımını derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: nordicplayground/nrfconnect-sdk:v2.6-branch
    steps:
      - uses: actions/checkout@v4

      - name: Derle (XIAO nRF52840)
        shell: bash
        run: |
          echo "== /root/entry.sh"; cat /root/entry.sh
          TC=$(ls -d /root/ncs/toolchains/*/ | head -1); echo "TC=$TC"; ls "$TC"; cat "$TC/environment.json" 2>/dev/null | head -60
          mkdir -p /workdir/project
          cp -r "$GITHUB_WORKSPACE/firmware/." /workdir/project/
          cd /workdir/project
          true west build -b xiao_ble --pristine -d build .
          mkdir -p "$GITHUB_WORKSPACE/out"
          true cp build/zephyr/zephyr.uf2 "$GITHUB_WORKSPACE/out/padmapper.uf2"

      - uses: actions/upload-artifact@v4
        with:
          name: padmapper-uf2
          path: out/padmapper.uf2
