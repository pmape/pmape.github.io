name: Kart yazılımını derle

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: nordicplayground/nrfconnect-sdk:v2.6-branch
    steps:
      - uses: actions/checkout@v4

      - name: Derle (XIAO nRF52840)
        shell: bash
        run: |
          TC=$(ls -d /root/ncs/toolchains/*/ | head -1); TC=${TC%/}
          export PATH="$TC/bin:$TC/usr/bin:$TC/usr/local/bin:$TC/opt/bin:$TC/opt/nanopb/generator-bin:$TC/opt/zephyr-sdk/arm-zephyr-eabi/bin:$PATH"
          export LD_LIBRARY_PATH="$TC/lib:$TC/lib/x86_64-linux-gnu:$TC/usr/local/lib"
          export GIT_EXEC_PATH="$TC/usr/local/libexec/git-core"
          export GIT_TEMPLATE_DIR="$TC/usr/local/share/git-core/templates"
          export PYTHONHOME="$TC/usr/local"
          export PYTHONPATH="$TC/usr/local/lib/python3.9:$TC/usr/local/lib/python3.9/site-packages"
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          export ZEPHYR_SDK_INSTALL_DIR="$TC/opt/zephyr-sdk"
          export ZEPHYR_BASE=/workdir/zephyr
          mkdir -p /workdir/project
          cp -r "$GITHUB_WORKSPACE/firmware/." /workdir/project/
          mkdir -p /workdir/project/assets
          cp "$GITHUB_WORKSPACE/web/padmapper.html" /workdir/project/assets/padmapper.html
          cd /workdir/project
          mkdir -p "$GITHUB_WORKSPACE/out"
          # 1) USB bellekli (ayar sayfası + indirme bağlantıları)
          west build -b xiao_ble --pristine -d build . -- -DEXTRA_CONF_FILE=msc.conf
          cp build/zephyr/zephyr.uf2 "$GITHUB_WORKSPACE/out/padmapper.uf2"
          # 2) belleksiz (bellek bir cihazda sorun çıkarırsa)
          west build -b xiao_ble --pristine -d build2 .
          cp build2/zephyr/zephyr.uf2 "$GITHUB_WORKSPACE/out/padmapper-bellek-yok.uf2"
          ls -l "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: padmapper-uf2
          path: |
            out/padmapper.uf2
            out/padmapper-bellek-yok.uf2

  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: padmapper-uf2
          path: android/app/src/main/assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android uygulamasını derle
        env:
          PM_KEY_PASS: ${{ secrets.PM_KEY_PASS }}
          PM_KEYSTORE: ${{ secrets.PM_KEYSTORE }}
        run: |
          if [ -n "$PM_KEYSTORE" ]; then echo "$PM_KEYSTORE" | base64 -d > android/padmapper.keystore; fi
          mkdir -p android/app/src/main/assets
          rm -f android/app/src/main/assets/padmapper-bellek-yok.uf2
          cp web/padmapper.html android/app/src/main/assets/padmapper.html
          grep -o 'FW_VERSION "[^"]*"' firmware/src/cfg.h | cut -d'"' -f2 > android/app/src/main/assets/fw_version.txt
          cat android/app/src/main/assets/fw_version.txt
          cd android
          gradle assembleRelease --no-daemon -q
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/padmapper-ayar.apk
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $AS verify --print-certs ../out/padmapper-ayar.apk | grep -i "subject" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: padmapper-apk
          path: out/padmapper-ayar.apk

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Releases sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: Son sürüm
          prerelease: true
          make_latest: false
          body: |
            En son derlenen kart yazılımı. **padmapper.uf2** dosyasını indir ve XIAO'ya yükle (USB bellekli).
            Bellek bir cihazda sorun çıkarırsa **padmapper-bellek-yok.uf2**.
            Tablet: **padmapper-ayar.apk** kur; kart takılınca ayar ekranı açılır.
            Ayar ekranı (bilgisayar): **padmapper.html** dosyasını Chrome'da aç, "Kart"a bas.
            Test sayfası: **test.html**.
          files: |
            out/padmapper.uf2
            out/padmapper-bellek-yok.uf2
            out/padmapper-ayar.apk
            web/padmapper.html
            web/test.html
      - name: Siteye koy (docs/ -> pmape.github.io)
        run: |
          git config user.name "pmape"
          git config user.email "pmape@users.noreply.github.com"
          git fetch -q origin main
          git checkout -q -B main origin/main
          mkdir -p docs
          cp out/padmapper.uf2 out/padmapper-bellek-yok.uf2 out/padmapper-ayar.apk docs/
          cp web/padmapper.html docs/index.html
          touch docs/.nojekyll
          FW=$(grep -o 'FW_VERSION "[^"]*"' firmware/src/cfg.h | cut -d'"' -f2)
          APP=$(grep -o "versionName '[^']*'" android/app/build.gradle | cut -d"'" -f2)
          echo "{\"fw\":\"$FW\",\"app\":\"$APP\"}" > docs/version.json
          git add docs
          git diff --cached --quiet || { git commit -q -m "Site: kart $FW, uygulama $APP [skip ci]"; git push -q origin main; }
